# acme — the landing-page showcase for metaobjects.dev.
#
# Deliberately small. This model exists to be the five-language example on the
# website and nothing else; anything richer belongs in examples/advanced-modeling/.
# Sigil-free YAML (ADR-0006): bare keys here lower to @-prefixed attrs in canonical
# JSON, while name/extends/children stay bare in both surfaces.
#
# `column: created_at` is declared rather than left to a default ON PURPOSE. The
# per-port DEFAULT for a field with no `@column` differs by design — `meta migrate`
# and TypeScript codegen snake_case it; C#, Java and Python codegen take the field
# name verbatim (EF's property=column convention); Kotlin codegen defaults
# snake_case while the shared JVM runtime defaults literal. For a real polyglot
# project the lever is each port's column-naming OPTION (`columnNamingStrategy` /
# `--column-naming` / `<columnNaming>`), set once per port to match the strategy
# `meta migrate` created the schema with — see docs/features/field-types.md.
# `@column` is for a name that genuinely cannot be derived (a legacy column, a
# schema owned outside this project), not a workaround for getting five ports'
# defaults to agree. This showcase declares it anyway, deliberately: the model
# is meant to be copy-pasteable and self-describing on its own, without also
# requiring every port's `meta gen` invocation on the site to pass a matching flag.
#
# It changes the COLUMN only. Every port's generated code still calls the field
# `createdAt` — the language-level name and the physical name are separate axes.
#
# The `# >>> snippet:` markers below delimit what the website publishes inline.
# Markers are the mechanism for HAND-AUTHORED files only — generated output is
# rewritten by every regen, so its excerpt lives beside it and is gated as an
# in-order subsequence of the real file instead.
metadata:
  package: acme
  children:
    # >>> snippet: showcase-model
    - object.entity:
        name: Subscriber
        children:
          - source.rdb:      { table: subscribers }
          - field.long:      { name: id }
          - field.string:    { name: email, maxLength: 320, required: true }
          - field.string:    { name: name }
          - field.enum:
              name: status
              values: [active, paused, cancelled]
              required: true
          - field.timestamp: { name: createdAt, column: created_at, autoSet: onCreate }
          - identity.primary: { name: primary, fields: [id], generation: increment }
    # <<<

    # >>> snippet: showcase-requirement
    - requirement.functional:
        name: subscriberCanBePausedWithoutErasingHistory
        title: Pausing preserves history
        level: 5
        status: live
        statement: "A subscriber's participation is switched by their own status, so they
          can be paused while everything they did stays on the record."
        counterexample: "A subscriber who can only be stopped by deletion, taking every
          record of their activity with them."
        description: >-
          A status on the subscriber rather than a deletion, so withdrawing an
          account leaves its history intact.
        implementedBy: [acme::Subscriber.status]
    # <<<

    # >>> snippet: showcase-prompt
    - object.value:
        name: SubscriberBlurbPayload
        children:
          - field.string: { name: subscriberName }
          - field.string: { name: status }

    - template.prompt:
        name: subscriberBlurb
        payloadRef: SubscriberBlurbPayload
        textRef: subscriber/blurb
    # <<<
