# acme — the landing-page showcase for metaobjects.dev.
#
# Deliberately small. This model exists to be the five-language example on the
# website and nothing else; anything richer belongs in examples/advanced-modeling/.
# Sigil-free YAML (ADR-0006): bare keys here lower to @-prefixed attrs in canonical
# JSON, while name/extends/children stay bare in both surfaces.
#
# `column: created_at` is declared rather than left to the default ON PURPOSE. A
# field with no `@column` takes its column name from the project's one `naming`
# setting in .metaobjects/config.json, which every port reads (default snake_case,
# what `meta migrate` creates) — see docs/features/field-types.md. `@column` is for a
# name that genuinely cannot be derived (a legacy column, a schema owned outside this
# project). This showcase declares it anyway, deliberately: the model is meant to be
# copy-pasteable and self-describing on its own, whatever naming the project that
# pastes it has set.
#
# It changes the COLUMN only. Every port's generated code still calls the field
# `createdAt` — the language-level name and the physical name are separate axes.
#
# The `# >>> snippet:` markers below delimit what the website publishes inline.
# Markers are the mechanism for HAND-AUTHORED files only — generated output is
# rewritten by every regen, so its excerpt lives beside it and is gated as an
# in-order subsequence of the real file instead.
metadata:
  package: acme
  children:
    # >>> snippet: showcase-model
    - object.entity:
        name: Subscriber
        children:
          - source.rdb:      { table: subscribers }
          - field.long:      { name: id }
          - field.string:    { name: email, maxLength: 320, required: true }
          - field.string:    { name: name }
          - field.enum:
              name: status
              values: [active, paused, cancelled]
              required: true
          - field.timestamp: { name: createdAt, column: created_at, autoSet: onCreate }
          - identity.primary: { name: primary, fields: [id], generation: increment }
    # <<<

    # >>> snippet: showcase-requirement
    - requirement.functional:
        name: subscriberCanBePausedWithoutErasingHistory
        title: Pausing preserves history
        level: 5
        status: live
        statement: "A subscriber's participation is switched by their own status, so they
          can be paused while everything they did stays on the record."
        counterexample: "A subscriber who can only be stopped by deletion, taking every
          record of their activity with them."
        description: >-
          A status on the subscriber rather than a deletion, so withdrawing an
          account leaves its history intact.
        implementedBy: [acme::Subscriber.status]
    # <<<

    # The payload members BIND to Subscriber's fields rather than restating them,
    # and that binding is the whole demonstration. `status` inherits the enum's
    # values and its requiredness, so the generated payload VO carries
    # `active | paused | cancelled` rather than a bare string — TS, C#, Python and
    # Kotlin alike (this showcase's JVM run emits Java DTOs only). Renaming
    # `Subscriber.name` then cannot leave this file quietly behind: `extends:
    # Subscriber.name` stops resolving and the load fails with ERR_UNRESOLVED_SUPER
    # (measured, not assumed). Propagating the rename here is therefore forced —
    # and THAT is what leaves a template still writing `{{name}}` as the one
    # surface nobody was made to look at, which `verify --templates` catches.
    # examples/showcase/drift/ is that sequence, and its output is page content.
    #
    # Only the line below travels to the website; this block is for readers here.
    # >>> snippet: showcase-prompt
    # Bound to Subscriber's fields — a projection, not a copy.
    - object.value:
        name: SubscriberBlurbPayload
        children:
          - field.string: { name: name, extends: Subscriber.name }
          - field.enum:   { name: status, extends: Subscriber.status }

    - template.prompt:
        name: subscriberBlurb
        payloadRef: SubscriberBlurbPayload
        textRef: subscriber/blurb
    # <<<
