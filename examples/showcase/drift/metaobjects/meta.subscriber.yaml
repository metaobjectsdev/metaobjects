# THIS FIXTURE EXISTS TO FAIL.
#
# It is examples/showcase/ with one change, made where the article says it is made:
# in the DOMAIN MODEL. `Subscriber.name` is renamed to `displayName`, and the blurb
# payload — whose members bind to Subscriber's fields — follows it, because leaving
# it behind would not compile: `extends: Subscriber.name` no longer resolves. The
# mustache still writes {{name}}, and nothing forced anyone to look at it.
#
# That is the whole point, and the reason this fixture is shaped the way it is. It
# used to rename a payload MEMBER, which made the page's claim — "the field got
# renamed in the domain model, the prompt was just the surface nobody checked" —
# a demo of something else. The rename now starts on the entity, propagates to the
# payload because the binding makes it, and stops at the template because nothing
# but `verify` was watching.
#
# `meta verify --templates` therefore reports ERR_VAR_NOT_ON_PAYLOAD, and THAT
# OUTPUT IS PAGE CONTENT — the transcript block on
# metaobjects.dev/articles/prompts-are-code.html is captured from this directory,
# not typed by hand. If this fixture ever goes green, the page is showing a stale
# error and the payload build fails (see scripts/site/payload.ts).
#
# It is a separate directory rather than a mutation of the showcase because the
# showcase itself must stay green — it is what the five-language section publishes.
#
# Deliberately small. This model exists to be the five-language example on the
# website and nothing else; anything richer belongs in examples/advanced-modeling/.
# Sigil-free YAML (ADR-0006): bare keys here lower to @-prefixed attrs in canonical
# JSON, while name/extends/children stay bare in both surfaces.
#
# The `# >>> snippet:` markers below delimit what the website publishes inline.
# Markers are the mechanism for HAND-AUTHORED files only — generated output is
# rewritten by every regen, so its excerpt lives beside it and is gated as an
# in-order subsequence of the real file instead.
metadata:
  package: acme
  children:
    # >>> snippet: showcase-model
    - object.entity:
        name: Subscriber
        children:
          - source.rdb:      { table: subscribers }
          - field.long:      { name: id }
          - field.string:    { name: email, maxLength: 320, required: true }
          - field.string:    { name: displayName }
          - field.enum:
              name: status
              values: [active, paused, cancelled]
              required: true
          - field.timestamp: { name: createdAt, column: created_at, autoSet: onCreate }
          - identity.primary: { name: primary, fields: [id], generation: increment }
    # <<<

    # >>> snippet: showcase-requirement
    - requirement.functional:
        name: subscriberCanBePausedWithoutErasingHistory
        title: Pausing preserves history
        level: 5
        status: live
        statement: "A subscriber's participation is switched by their own status, so they
          can be paused while everything they did stays on the record."
        counterexample: "A subscriber who can only be stopped by deletion, taking every
          record of their activity with them."
        description: >-
          A status on the subscriber rather than a deletion, so withdrawing an
          account leaves its history intact.
        implementedBy: [acme::Subscriber.status]
    # <<<

    # >>> snippet: showcase-prompt
    - object.value:
        name: SubscriberBlurbPayload
        children:
          - field.string: { name: displayName, extends: Subscriber.displayName }
          - field.enum:   { name: status, extends: Subscriber.status }

    - template.prompt:
        name: subscriberBlurb
        payloadRef: SubscriberBlurbPayload
        textRef: subscriber/blurb
    # <<<
