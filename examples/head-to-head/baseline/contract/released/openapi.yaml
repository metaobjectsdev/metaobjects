openapi: 3.1.0
info:
  title: Customer API
  version: 0.0.0
tags: []
paths:
  /customers:
    get:
      operationId: Customers_list
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      operationId: Customers_create
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
  /customers/{id}:
    get:
      operationId: Customers_read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: The server cannot find the requested resource.
components:
  schemas:
    CreateCustomer:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        name:
          type: string
          maxLength: 200
        plan:
          $ref: '#/components/schemas/Plan'
          default: free
    Customer:
      type: object
      required:
        - id
        - email
        - plan
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 200
        plan:
          $ref: '#/components/schemas/Plan'
        createdAt:
          type: string
          format: date-time
    Plan:
      type: string
      enum:
        - free
        - pro
    WelcomePayload:
      type: object
      required:
        - email
        - plan
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 200
        plan:
          $ref: '#/components/schemas/Plan'
      description: The template for picking properties.
