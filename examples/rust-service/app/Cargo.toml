[package]
name = "tasks_app"
version = "0.1.0"
edition = "2021"
publish = false
description = "A tasks API whose model, store, rules, service and routes are generated by MetaObjects."

[dependencies]
meta_http = { path = "../generated/meta_http" }
tasks_http = { path = "../generated/tasks_http" }
tasks_rules = { path = "../generated/tasks_rules" }
tasks_service = { path = "../generated/tasks_service" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net"] }
