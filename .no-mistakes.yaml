# no-mistakes gate configuration — metaobjects
#
# WHY THIS EXISTS. With no commands declared, the gate's test step is an AGENT choosing
# "the smallest relevant tests" to run. This repository already has the answer committed:
# `scripts/ci-local.sh`, the single definition of the checks — every check workflow in
# `.github/workflows/` runs on GitHub as a thin wrapper over it (hygiene.yml's leak scan,
# conformance.yml's lanes, integration-tests.yml's Testcontainers matrix), so pinning the
# gate to it runs exactly the repository's checks, the same ones GitHub runs.
#
# THE SPLIT. `lint` is `--only gates`, the one lane every change runs. `test` is
# `--affected`: it lists what the branch changed against its merge base, maps the paths to
# lanes with scripts/ci-lane-map.txt, prints which lanes it selected, skipped and why, and
# runs only those (ts-fast + ts-unit for a TypeScript or web-client change; java-slow,
# python or csharp for a change confined to that port; every selectable lane for a change
# to fixtures, spec, scripts, workflows, agent-context or any path the map does not claim;
# none for a docs-only change, which the gates lane covers). Selected lanes run exactly as
# `--only <lane> --no-integration` does, so a lane's contents are unchanged. Force every
# lane with MO_CI_FULL=1. Before 2026-11-15 this step was always `--only ts-fast --only
# ts-unit`, so a Java, Python or C# change was validated by the TypeScript tests and by
# nothing in its own port. Measured green on a warm tree 2026-09-18: ts-fast + ts-unit
# 256s, gates 23s. The test step's mutation gate is DIFF-SCOPED (gate_completeness_diff in
# the script) and runs inside ts-fast: it mutates only the stryker.conf.mjs `mutate` files
# the branch changed against its base, and SKIPs when it changed none. That is unchanged by
# the selection. The full pass is `--only mutation`, the flagless run's mutation lane, and
# conformance.yml (tags, nightly, dispatch).
#
# ORDER IS LOAD-BEARING, and it is why the work is split this way round rather than one
# `--quick` in `test`. The pipeline runs test BEFORE lint. The `gates` section contains
# `site payload is true`, which spawns the `meta` CLI — and the CLI prefers a package's
# compiled `dist/` over its source, so on a tree whose dist is stale that gate regenerates
# with the OLD emitter and fails. `--quick` runs the gates before the build and hits exactly
# that: measured here, `meta gen` died on `sidecarLine is not a function` and the gate went
# red on a tree that is green. Building first in `test` and running the gates after in
# `lint` removes it — the same tree that failed under `--quick` passed as `--only gates`.
# So do not "simplify" this back into a single `--quick` step: it is ~30s cheaper and it
# reports a false red.
#
# --strict-toolchains closes a SKIP hole, and only that. These selections run two kinds of
# step. The `step_if bun` ones — every step in `ts-fast` and `ts-unit`, and 17 of the 32 in
# `gates` — are the hazard: without the flag, a host with no bun on PATH SKIPS them and the
# step still reports GREEN. Strict turns that false green into a loud failure. The other 15
# `gates` steps run under plain `step`, so they were never at risk either way: a missing
# binary just makes the command fail. Most are shell-only (grep/sed — `check-pom-versions.sh`
# and `check-uv-lock-version.sh` are deliberately toolchain-free so they need no lane), but
# NOT all of them, which is the part worth being exact about: five invoke `node` directly
# (publish-set, script-name hooks, extract field kinds, metamodel-version, migration guides),
# `check-publish-intent.sh` spawns `node` internally, and `gate_positioning_claims` invokes
# bare `bun`. `gates`, `ts-fast` and `ts-unit` invoke no dotnet/mvn/uv. `--affected` can select the
# lanes that do, and there the flag is the point: a change to that port with its toolchain
# missing FAILS, where a plain run would skip it and report green.
#
# WHAT IS DELIBERATELY NOT HERE — the docker half. `--affected` implies `--no-integration`:
# integration-tests.yml's five-port Testcontainers matrix, the migrate-ts / runtime-ts
# real-Postgres suites (`--only ts-slow`) and the cube live check need a live Docker daemon,
# which a gate host is not guaranteed to have, and a down daemon SKIPS silently without
# `--strict-toolchains`. They turn a ~4.5 minute step into a much longer one on every round.
# A port's selected lane DOES need its toolchain (dotnet, mvn, uv), and under
# `--strict-toolchains` a missing one FAILS rather than skipping, so a change to that port
# is never reported green unchecked. docs/RELEASING.md requires the flagless run before
# `bun publish`, which is where the docker half and every lane are enforced.
#
# NOTE: this file must be at the repo ROOT as `.no-mistakes.yaml` (NOT under
# .no-mistakes/), and repo commands are read from the DEFAULT BRANCH — so nothing here
# takes effect until it is merged to `main`.
#
# There is no `ci` section and none is needed: `no-mistakes status` reports this repository
# as `ci_mode: local`, so the gate skips the CI step and monitors no forge checks — the
# commands above already run the same script the GitHub workflows run.

commands:
  test: "scripts/ci-local.sh --affected --strict-toolchains"
  lint: "scripts/ci-local.sh --only gates --strict-toolchains"

# Public repository: keep PR bodies short and the run intent out of them.
pr:
  publish_intent: false
  appendix: collapsed

# Mark a failing test command as pre-existing when it also fails on the base.
#
# THE EVIDENCE PHASE. After `commands.test` passes, the gate ALWAYS runs an agent that derives
# end-user scenarios and drives the product itself; no setting turns that turn off. It, not
# `commands.test`, is the long part of this step: 264 recorded Test steps for this repository
# average about 43 minutes, 130 of them over 30, against 4-5 for the command itself, and the
# agent's budget is 75 minutes on this host. Its prompt is the one thing a repository controls,
# so the runbook below scopes it the way `--affected` scopes the command: by the paths the
# change touches (`path_instructions` match the changed-file list, as scripts/ci-lane-map.txt
# does). This is guidance to a model, not a switch: it narrows what the agent is told to do
# and does not bound it. The bound is the host's `test_agent_timeout`. These fields are read
# from the default branch only, so they too take effect after merge.
test:
  base_attribution: true
  instructions: |
    This repository ships libraries, a code generator and command line tools. There is no server or app to start. The test command already ran the lanes this change affects, and its output begins with the lanes it selected and skipped, so do not re-run the full suites or the lanes of ports the change does not touch. Drive the changed behavior directly instead: run the affected CLI command or generator on a small fixture from the fixtures directory, or the focused tests of the module the change touches. Keep to at most three scenarios and finish in about ten minutes. Report no-surface when the change has no runtime behavior, such as documentation, comments, CI configuration or metadata.
  path_instructions:
    - path: "docs/**"
      instructions: |
        Documentation only. There is nothing to start or drive. Return no-surface at once without running anything, the gates lane checks the documentation.
    - path: "server/typescript/**"
      instructions: |
        TypeScript port. Drive the meta CLI from the workspace on a fixture, or run bun test in only the package the change touches. Do not run the Java, Python or C# suites.
    - path: "client/web/**"
      instructions: |
        Web client packages. Run bun test in only the package the change touches and check that its built entry still bundles. Do not run the server suites.
    - path: "server/java/**"
      instructions: |
        Java and Kotlin ports. Run mvn test for only the Maven modules the change touches, with -pl and -am, not the whole reactor. Do not run the TypeScript, Python or C# suites.
    - path: "server/python/**"
      instructions: |
        Python port. Run pytest on only the test modules the change touches. Do not run the TypeScript, Java or C# suites.
    - path: "server/csharp/**"
      instructions: |
        C# port. Run dotnet test on only the test project the change touches. Do not run the TypeScript, Java or Python suites.
