[project]
name = "metaobjects"
version = "0.0.1"
description = "Python implementation of the MetaObjects metadata standard (loader + conformance)."
requires-python = ">=3.11"
dependencies = [
    # YAML authoring front-end (ADR-0006). The desugar lowers sugared YAML to
    # canonical JSON before the shared tree-builder runs.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "pydantic>=2"]
# On-demand cross-language persistence-conformance suite. pg8000 is pure-python
# so this extra installs cleanly without native deps; the harness shells out
# to the docker CLI directly (matches the TS/Java pattern of bypassing
# testcontainers wrappers entirely).
integration = ["pg8000>=1.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metaobjects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/metaobjects", "tests"]
# Golden expected files are generated-code fixtures (relative imports resolve only
# as an emitted package); they are validated by the golden + import-check tests, not mypy.
exclude = ["tests/codegen/golden/"]
