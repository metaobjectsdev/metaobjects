# Test-only trace entity for the AI-trace recorder PG round-trip (Python, Slice 1).
# Loaded alongside the shipped library/ai/llm-call.yaml (LlmCallBase). Declares a
# typed voResponse jsonb column by hand (Slice 3 will switch this to derivation
# from a nested template.prompt).
metadata:
  package: metaobjects::ai
  children:
    # Typed value object stored in the voResponse jsonb column.
    - object.value:
        name: GreetingResponse
        children:
          - field.string: { name: greeting }
          - field.int:    { name: score }

    # Concrete trace entity: inherits the 18 LlmCallBase fields, declares its
    # table + primary identity + a typed voResponse jsonb column.
    - object.entity:
        name: GreetingCall
        extends: metaobjects::ai::LlmCallBase
        children:
          - source.rdb:       { table: llm_call, role: primary }
          - identity.primary: { name: primary, fields: ["spanId"] }
          - field.object:
              name: voResponse
              storage: jsonb
              objectRef: metaobjects::ai::GreetingResponse
