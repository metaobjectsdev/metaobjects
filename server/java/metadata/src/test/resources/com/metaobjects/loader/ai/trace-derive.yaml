# Unit fixture for LlmTraceFieldDeriver (Slice 3, Java port).
# Self-contained: a minimal abstract LlmCallBase + two typed VOs + a concrete
# trace entity carrying a template.prompt with payloadRef/responseRef. The
# deriver must inject voRequest/voResponse field.object jsonb columns onto
# TraceCall; PlainEntity (a prompt but no LlmCallBase) and BareCall (LlmCallBase
# but no prompt) must be left untouched.
metadata:
  package: test::ai
  children:
    - object.entity:
        name: LlmCallBase
        abstract: true
        children:
          - field.uuid: { name: spanId }

    - object.value:
        name: ReqVo
        object: com.metaobjects.object.value.ValueObject
        children:
          - field.string: { name: prompt }

    - object.value:
        name: RespVo
        object: com.metaobjects.object.value.ValueObject
        children:
          - field.string: { name: greeting }
          - field.int:    { name: score }

    # Concrete trace entity → voRequest + voResponse derived.
    - object.entity:
        name: TraceCall
        extends: test::ai::LlmCallBase
        children:
          - source.rdb:       { table: trace_call, role: primary }
          - identity.primary: { fields: ["spanId"] }
          - template.prompt:
              name: ask
              payloadRef: test::ai::ReqVo
              responseRef: test::ai::RespVo

    # Extends LlmCallBase but has no prompt → no derivation.
    - object.entity:
        name: BareCall
        extends: test::ai::LlmCallBase
        children:
          - source.rdb:       { table: bare_call, role: primary }
          - identity.primary: { fields: ["spanId"] }

    # Has a prompt but does NOT extend LlmCallBase → no derivation.
    - object.entity:
        name: PlainEntity
        children:
          - field.uuid:       { name: id }
          - source.rdb:       { table: plain_entity, role: primary }
          - identity.primary: { fields: ["id"] }
          - template.prompt:
              name: ask
              payloadRef: test::ai::ReqVo
              responseRef: test::ai::RespVo
