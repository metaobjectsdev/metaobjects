[package]
name = "metaobjects-codegen"
description = "MetaObjects code generation for Rust: the run engine and the shipped generators."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["metadata", "codegen", "code-generation", "schema", "rest"]
categories = ["development-tools", "development-tools::build-utils"]
build = "build.rs"

[dependencies]
metaobjects = { path = "../metaobjects", version = "1.3.0" }
metaobjects-render = { path = "../metaobjects-render", version = "1.3.0" }
serde_json.workspace = true
indexmap.workspace = true
serde.workspace = true

[dev-dependencies]
# The layout ratchet (tests/layout_ratchet.rs) parses generator source to find hand-typed layout.
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
