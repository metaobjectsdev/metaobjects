# The Rust port of MetaObjects (preview). ADR-0063 records why it exists and how it
# differs from the other five ports.
#
# One crate today: `metaobjects` (metamodel registry, JSON loader, canonical
# serializer). The codegen engine (`metaobjects-codegen`) and the `cargo meta`
# command (`metaobjects-cli`) join this workspace in later steps; no placeholder
# crates are created for them ahead of time.
[workspace]
resolver = "3"
members = ["metaobjects"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/metaobjectsdev/metaobjects"

[workspace.dependencies]
# `preserve_order` keeps object keys in document order, which the loader needs:
# children, attrs and error paths all follow authoring order, as JSON.parse does.
serde_json = { version = "1.0.140", features = ["preserve_order"] }
indexmap = "2.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
