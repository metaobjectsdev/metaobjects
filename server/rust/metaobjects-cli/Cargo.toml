[package]
name = "metaobjects-cli"
description = "The `cargo meta` command for MetaObjects on Rust: init, gen, verify and eject."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["metadata", "codegen", "cargo", "cli", "schema"]
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]
# The crates.io name `cargo-meta` belongs to an unrelated crate, so this package is
# `metaobjects-cli` and only its binary is called `cargo-meta`; that binary name is what makes
# cargo's external-subcommand rule run it for `cargo meta ...`.

[lib]
name = "metaobjects_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-meta"
path = "src/main.rs"

[dependencies]
metaobjects = { path = "../metaobjects", version = "0.1.0" }
metaobjects-codegen = { path = "../metaobjects-codegen", version = "0.1.0" }
metaobjects-render = { path = "../metaobjects-render", version = "0.1.0" }
serde_json.workspace = true


[lints]
workspace = true
