# MetaObjects' own requirements ledger.
#
# This is stock metadata: `requirement.functional` and `requirement.architectural`
# as shipped, loaded by the same loader, under the same strict registry, as any
# adopter's. No custom attributes, no `strict: false`.
#
# `implementedBy` is omitted on every node, deliberately. Its referent is a MODEL
# node and this repository declares no `object.entity` at all — the ledger's subject
# is the solution itself. Omitting it is legal (min=0) and dangle-free, and it is
# why `meta verify` reports WARN_REQUIREMENT_NOTHING_IMPLEMENTS on every live
# functional node. That warning is expected and pinned by
# scripts/check-requirements-ledger.ts. Do not silence it.
#
# Levels are PROBLEM-DOMAIN (the level attribute's byte-gated description: "L1-L3 are
# levels of abstraction and ownership in the problem domain, NOT of code structure").
# No node at L1-L3 may name a package, port, module or deployable.
metadata.root:
  package: metaobjects
  children:
    - requirement.functional:
        name: metaobjects
        title: MetaObjects
        level: 1
        status: live
        statement: >-
          One typed declaration of a domain model drives code, runtime behaviour and
          drift checks across five languages, and what it generates keeps working with
          MetaObjects uninstalled.
        counterexample: >-
          A model that has to be restated by hand in each language, or generated code
          that stops compiling once the toolchain is removed.
        children:
          - requirement.functional:
              name: declare
              title: Declare the model
              level: 2
              status: live
              statement: >-
                A domain model is expressed once, in typed metadata, with enough
                fidelity that every downstream artifact can be derived from it.
              counterexample: >-
                A model fact restated inside a generator, a migration or a
                hand-written type because the metadata cannot say it.
              children:
                - requirement.functional:
                    name: typedFieldVocabulary
                    title: Typed field vocabulary
                    level: 3
                    status: live
                    statement: >-
                      Every value a model can hold has a declared field type that fixes
                      its native type, its storage and its wire form together, so the
                      three cannot disagree.
                    counterexample: >-
                      A price stored as a floating-point number, where adding 0.1 and
                      0.2 does not give 0.3.
                    notes: >-
                      The behaviour-over-storage test is ADR-0037's: ask what a value
                      DOES, not whether it is a string. url and ip became field.uri and
                      field.inet because they carry native types and behaviour; email
                      and hostname stayed plain validated strings.

                - requirement.functional:
                    name: objectTaxonomy
                    title: The object taxonomy
                    level: 3
                    status: live
                    statement: >-
                      Every declared object is exactly one of three kinds — it owns its
                      data, it is a pure shape, or it is derived — and the kind decides
                      what the object is allowed to carry.
                    counterexample: >-
                      A shape meant only for transport that has acquired its own primary
                      key and a writable table.
                    description: >-
                      Covers which kinds exist and what each may hold. How a kind's data
                      is physically stored is persistenceMapping.

                - requirement.functional:
                    name: attributeValueTypes
                    title: Attribute value types
                    level: 3
                    status: live
                    statement: >-
                      Every attribute a declaration carries has a declared value type,
                      and a closed set of members where the set is closed, so a wrong
                      value is refused where it was written.
                    counterexample: >-
                      A misspelled status accepted as an ordinary string, silently
                      disabling the check that was supposed to read it.
                    notes: >-
                      Where the members of a closed set are policed decides how many
                      ports can be wrong at once. The requirement status enum is
                      enforced by the loader rather than by a checker precisely so a
                      typo fails to load in every language, instead of passing silently
                      in four of them and being caught in the fifth.

                - requirement.functional:
                    name: persistenceMapping
                    title: Persistence mapping
                    level: 3
                    status: live
                    statement: >-
                      A declaration says where its data lives and which values identify
                      one row of it, in terms that do not presume a particular database.
                    counterexample: >-
                      An entity whose rows cannot be addressed one at a time, because
                      nothing in the declaration says which values identify one.
                    description: >-
                      Covers the placement of a collection and the identity of a row.
                      How one value is typed and stored is typedFieldVocabulary; which
                      engine the result is emitted for is a codegen concern.

                - requirement.functional:
                    name: relationships
                    title: Relationships
                    level: 3
                    status: live
                    statement: >-
                      A relationship between two objects is declared once, and
                      everything that follows from it — the keys, the join, the
                      traversal — is derived from that one declaration.
                    counterexample: >-
                      The same association stated on both sides, with the two statements
                      disagreeing about which side holds the key.

                - requirement.functional:
                    name: derivation
                    title: Derivation
                    level: 3
                    status: live
                    statement: >-
                      A value that comes from somewhere else declares where from, and is
                      therefore read-only everywhere it appears.
                    counterexample: >-
                      A stored total that can be written directly, so the total and the
                      rows it sums stop agreeing and nothing notices.
                    description: >-
                      Covers where a derived value comes from and what that makes it.
                      How two objects are connected in the first place is relationships.

                - requirement.functional:
                    name: constraints
                    title: Constraints
                    level: 3
                    status: live
                    statement: >-
                      A rule about what a value may be is declared on the model, so the
                      same rule holds at every point a value can arrive.
                    counterexample: >-
                      A value the form refuses and the endpoint behind it accepts.
                    notes: >-
                      Not hypothetical. Until 0.16.0 two ports described their declared
                      constraints and did not enforce them at the wire tier, so a
                      required value could be omitted over HTTP and fail later at the
                      database. Declared-but-decorative is the failure mode this entry
                      exists to forbid.

                - requirement.functional:
                    name: presentation
                    title: Presentation
                    level: 3
                    status: live
                    statement: >-
                      How a value should be shown to a person is declared beside the
                      value, in terms no particular user interface owns.
                    counterexample: >-
                      A declaration that has to be edited because the interface reading
                      it was rebuilt, even though nothing about the data changed.
                    description: >-
                      Covers what the model may say about presenting a value. What is
                      actually rendered from that is webClient.

                - requirement.functional:
                    name: declaredPrompts
                    title: Declared prompts
                    level: 3
                    status: live
                    statement: >-
                      What a prompt sends to a model is a declared typed shape, so what
                      it sends is a fact about the model rather than a property of the
                      code that assembled it.
                    counterexample: >-
                      A prompt whose payload has doubled in size with no diff showing
                      it, because its fields were gathered by walking an object at run
                      time.
                    description: >-
                      Covers declaring the payload and the response shape. Rendering
                      them and reading a reply back are under promptConstruction.

                - requirement.functional:
                    name: governanceVocabulary
                    title: Governance vocabulary
                    level: 3
                    status: live
                    statement: >-
                      A capability the solution itself provides can be declared,
                      levelled and checked by the same loader as everything else in the
                      model.
                    counterexample: >-
                      A list of what the product does, kept in a document, that no build
                      reads and that nothing fails when it goes stale.
                    notes: >-
                      This entry is the one being exercised as it is written: the file
                      it sits in is MetaObjects' own ledger, loaded by the shipped
                      loader under the strict registry. If the capability were not real
                      the entry could not exist.

                - requirement.functional:
                    name: inheritanceAndReferences
                    title: Inheritance and references
                    level: 3
                    status: live
                    statement: >-
                      A declaration can build on another and name one anywhere in the
                      model unambiguously, and what a name resolves to never depends on
                      the order the declarations were read.
                    counterexample: >-
                      One model resolving a name two different ways on two machines,
                      because the declarations happened to be read in a different order.
                    notes: >-
                      The counterexample is an observed defect, not an invented one: a
                      dotted reference to an inherited member resolved or failed
                      depending on directory-listing order, so the same sources behaved
                      differently under two runtimes. Order-independence is a property
                      of the resolver, which is why it is stated as a promise here.

                - requirement.functional:
                    name: authoringFrontEnds
                    title: Authoring front-ends
                    level: 3
                    status: live
                    statement: >-
                      A model can be authored in a form a person is willing to write by
                      hand, and lowered to the one interchange form every port reads by
                      a lowering with exactly one answer.
                    counterexample: >-
                      Two authors writing the same model in the friendlier form and
                      getting two different interchange documents out of it.

          - requirement.functional:
              name: codegen
              title: Codegen
              level: 2
              status: live
              statement: >-
                Every artifact derivable from the declaration is emitted as idiomatic
                per-language code the adopter owns and may hand-edit.
              counterexample: >-
                An adopter hand-writing a foreign key, a CRUD route or a validator
                chain the metadata already describes.
              children:
                - requirement.functional:
                    name: entityAndSchema
                    title: Entity and schema artifacts
                    level: 3
                    status: live
                    statement: >-
                      The types and the table definitions an adopter would otherwise
                      write by hand are emitted from the declaration, in the idiom of
                      the language they land in.
                    counterexample: >-
                      A field added to the declaration and then added a second time, by
                      hand, to a type and to a table.

                - requirement.functional:
                    name: dataAccess
                    title: Data access
                    level: 3
                    status: live
                    statement: >-
                      Reading and writing a declared object is generated as typed code,
                      so a query naming something the model does not have fails before
                      it runs.
                    counterexample: >-
                      A misspelled field reaching the database and coming back as a
                      runtime error, rather than failing where it was written.

                - requirement.functional:
                    name: apiSurface
                    title: API surface
                    level: 3
                    status: live
                    statement: >-
                      The request and response contract for a declared object is
                      generated from the declaration, and is the same contract whichever
                      language serves it.
                    counterexample: >-
                      Two servers built from one declaration disagreeing about whether
                      an absent field means leave it alone or clear it.

                - requirement.functional:
                    name: webClient
                    title: Web client artifacts
                    level: 3
                    status: live
                    statement: >-
                      The forms, grids and typed calls a browser needs are generated
                      from the same declaration that generated what serves them.
                    counterexample: >-
                      A field added to the model, served by the API and missing from the
                      screen, because the two were built from different lists.

                - requirement.functional:
                    name: ownershipAndRegeneration
                    title: Ownership and regeneration
                    level: 3
                    status: live
                    statement: >-
                      Generated output belongs to the adopter: a hand edit inside it
                      survives the next regeneration, and the generator that produced it
                      can be taken over and changed.
                    counterexample: >-
                      A hand edit inside generated output silently gone after the next
                      run.
                    notes: >-
                      What makes the promise keepable is a committed merge base — one
                      hash per generated path, recorded when it was written. Without it
                      a machine that did not generate the output cannot tell a file it
                      wrote from one somebody edited, so a fresh clone or a CI runner
                      overwrites hand edits instead of refusing them by name. The
                      snapshot bodies are ignored; the hashes are committed, and that
                      asymmetry is the whole mechanism.

                - requirement.functional:
                    name: documentationAndAgentContext
                    title: Documentation and agent context
                    level: 3
                    status: live
                    statement: >-
                      The documentation and the agent-facing context an adopter reads
                      are derived from the model, so neither can describe a model that
                      no longer exists.
                    counterexample: >-
                      A shipped page or instruction teaching vocabulary that was retired
                      before it was written.
                    notes: >-
                      The counterexample is the observed failure, three separate times,
                      and an adopter found it every time rather than a gate. That is
                      why it is stated as a capability with a check behind it instead of
                      an editorial habit.

          - requirement.functional:
              name: runtimeMetadata
              title: Runtime metadata
              level: 2
              status: live
              statement: >-
                Metadata loaded at runtime drives behaviour with no generated code in
                the path.
              counterexample: >-
                A dynamic admin screen that needs a code change and a redeploy to show
                a newly declared field.
              children:
                - requirement.functional:
                    name: metadataDrivenCrud
                    title: Metadata-driven CRUD
                    level: 3
                    status: live
                    statement: >-
                      Creating, reading, updating and deleting a declared object works
                      from the declaration alone, with no generated code in the path.
                    counterexample: >-
                      A newly declared object that cannot be stored or listed until
                      something has been generated and deployed.

                - requirement.functional:
                    name: typedQueryAndFilter
                    title: Typed query and filter
                    level: 3
                    status: live
                    statement: >-
                      A caller filters and sorts by declared fields only, and an
                      undeclared or disallowed one is refused rather than ignored.
                    counterexample: >-
                      A filter naming a field nobody declared, quietly returning every
                      row instead of being refused.
                    notes: >-
                      Refused rather than ignored is the load-bearing half. Dropping an
                      unrecognised filter is the fail-OPEN reading: the caller believes
                      the result is narrowed, and it is the whole table.

                - requirement.functional:
                    name: validationEnforcement
                    title: Validation enforcement
                    level: 3
                    status: live
                    statement: >-
                      A declared constraint is applied to a value at the moment it
                      arrives, by the runtime itself.
                    counterexample: >-
                      A value that breaks a declared rule, stored anyway, and found only
                      when something downstream chokes on it.
                    description: >-
                      Covers applying a rule at run time. Declaring the rule once so it
                      can be applied everywhere is constraints, under declare.

                - requirement.functional:
                    name: relationshipNavigation
                    title: Relationship navigation
                    level: 3
                    status: live
                    statement: >-
                      A declared relationship can be traversed at run time, from one row
                      to the rows it relates to, without hand-written join code.
                    counterexample: >-
                      Reaching an order's lines needing a query somebody wrote by hand,
                      restating a join the model already describes.

          - requirement.functional:
              name: driftDetection
              title: Drift detection
              level: 2
              status: live
              statement: >-
                Divergence between the declaration and what was built from it is
                detected before it reaches production.
              counterexample: >-
                A renamed field that silently degrades a prompt, or a column the
                database has and the model does not.
              children:
                - requirement.functional:
                    name: schemaMigration
                    title: Schema migration
                    level: 3
                    status: live
                    statement: >-
                      The difference between a declaration and a live database is
                      computed, and emitted as a migration that can be applied and
                      undone.
                    counterexample: >-
                      A schema change that goes forward and not back, so the only way
                      out of a bad deploy is a restore from backup.

                - requirement.functional:
                    name: codegenDrift
                    title: Codegen drift
                    level: 3
                    status: live
                    statement: >-
                      Generated output that no longer matches the declaration it came
                      from is reported before it is deployed.
                    counterexample: >-
                      A field renamed in the model months ago, still spelled the old way
                      in code that ships, with every build green.

                - requirement.functional:
                    name: promptAndTemplateDrift
                    title: Prompt and template drift
                    level: 3
                    status: live
                    statement: >-
                      A prompt that names something the model no longer has is caught
                      when it is built, not when it is sent.
                    counterexample: >-
                      A renamed field leaving a hole in a prompt, so the model answers a
                      question it was never fully asked and nothing reports an error.

                - requirement.functional:
                    name: liveDatabaseVerification
                    title: Live database verification
                    level: 3
                    status: live
                    statement: >-
                      A running database can be checked against the declaration without
                      changing it.
                    counterexample: >-
                      The only way to learn whether production matches the model being
                      to run a migration against production.

          - requirement.functional:
              name: promptConstruction
              title: Prompt construction
              level: 2
              status: live
              statement: >-
                A prompt is code: its payload is a typed projection, its text is
                external and provider-resolved, and its rendering is deterministic.
              counterexample: >-
                A whitespace change silently breaking an exact-prefix prompt-cache hit.
              children:
                - requirement.functional:
                    name: payloadProjection
                    title: Payload projection
                    level: 3
                    status: live
                    statement: >-
                      What a prompt sends is a declared projection, authoritative over
                      anything that could be derived instead, so growth in what is sent
                      arrives as a diff.
                    counterexample: >-
                      A payload that grew by a whole nested object nobody chose, because
                      a field's shape was taken from where its value comes from rather
                      than from what was declared.
                    notes: >-
                      The counterexample is an observed defect. Three ports typed a
                      payload field from its origin child instead of its declaration,
                      and the worst arm substituted the related entity for the curated
                      shape the author had declared — invisible in review, because the
                      metadata still read as curated.

                - requirement.functional:
                    name: deterministicRender
                    title: Deterministic render
                    level: 3
                    status: live
                    statement: >-
                      One payload and one template render to the same bytes on every run
                      and in every language.
                    counterexample: >-
                      Two runs over one unchanged payload producing different bytes, so
                      the exact-prefix cache hit is lost and the same prompt is paid for
                      twice.

                - requirement.functional:
                    name: parserOnReceipt
                    title: Parser on receipt
                    level: 3
                    status: live
                    statement: >-
                      A declared response shape is parsed and checked when a reply
                      arrives, rather than trusted.
                    counterexample: >-
                      A reply that is nearly the right shape read as though it were the
                      right shape, carrying a wrong value onward as if it had been
                      checked.

          - requirement.functional:
              name: governTheStandard
              title: Govern the standard
              level: 2
              status: live
              statement: >-
                The registered vocabulary is identical in every port, changes only
                deliberately, and records its retirements so they cannot be revived by
                accident.
              counterexample: >-
                One attribute meaning three different things in three ports while every
                gate reports green.
              children:
                - requirement.functional:
                    name: crossLanguageIdentity
                    title: Cross-language identity
                    level: 3
                    status: live
                    statement: >-
                      One declaration means the same thing in every language, and a
                      divergence fails a gate rather than reaching an adopter.
                    counterexample: >-
                      One model producing two different column names on one machine,
                      depending on which language's runtime wrote the row.
                    notes: >-
                      Measured, not feared. A single attribute naming a column was found
                      to mean three different things across the ports at once — one used
                      it as a field name, one ignored it entirely and hardcoded a
                      convention, one resolved it literally — while every port
                      byte-matched the shared vocabulary manifest throughout. The
                      manifest proves the ports SPELL the vocabulary identically and is
                      blind to what they DO with it. This entry is the promise that
                      blindness needs.

                - requirement.functional:
                    name: vocabularyLifecycle
                    title: Vocabulary lifecycle
                    level: 3
                    status: live
                    statement: >-
                      Vocabulary enters deliberately and leaves recorded, with a
                      mechanical path from the retired form to the one that replaced it.
                    counterexample: >-
                      A construct that was deliberately removed, rebuilt by someone who
                      believed they were extending it, because nothing they could read
                      said it had been taken out on purpose.
                    notes: >-
                      The counterexample is the one claim a controlled round did not
                      refute: against a deliberately-retired capability, model-only
                      agents flagged it 0 times out of 24 — every run proposing to extend
                      it, each believing it was reusing rather than reviving — while
                      arms with a ledger caught it 19 of 40. Under half is not a
                      guarantee, and the entry does not claim to be one.

                - requirement.functional:
                    name: versioningAndRelease
                    title: Versioning and release
                    level: 3
                    status: live
                    statement: >-
                      What metadata may say and what the software offers are separate
                      contracts with separate version numbers, and a change to either
                      moves its own.
                    counterexample: >-
                      A change to what metadata may say, shipped under a number that only
                      ever promised a change to the software.

    - requirement.architectural:
        name: quality
        title: Quality obligations
        level: 1
        status: live
        statement: >-
          MetaObjects meets stated, checkable quality obligations, organised by the
          ISO/IEC 25010:2023 product quality characteristics it actually bears.
        counterexample: >-
          A quality claim in a README that no gate, corpus or test can falsify.
        notes: >-
          Organised by ISO/IEC 25010:2023's product quality characteristics. Two of
          the nine are deliberately absent: functional suitability, because the
          functional capability map is that characteristic in full; and safety,
          because nothing in scope can cause physical harm. The tree shape follows
          the arc42 / ATAM quality tree, whose leaves are concrete falsifiable
          scenarios — which is what statement plus counterexample already is.
        children:
          - requirement.architectural:
              name: compatibility
              title: Compatibility
              level: 2
              status: live
              statement: >-
                One declaration produces the same meaning in every language port and on
                every wire, so a consumer can change ports without changing behaviour.
              counterexample: >-
                One attribute meaning three different things in three ports while every
                gate reports green.
              notes: >-
                The dominant characteristic for this project and the one the entire
                conformance apparatus exists to defend. Author its children first.
              children:
                - requirement.architectural:
                    name: byteIdenticalRendering
                    title: Byte-identical rendering
                    level: 3
                    status: live
                    statement: >-
                      Every port renders one declared template over one payload to the
                      same bytes.
                    counterexample: >-
                      One payload rendering differently depending on which language
                      produced it, with no error raised anywhere.
                    notes: >-
                      The failure this guards against is quiet by nature. A conditional
                      section over a derived accessor was dropped silently by every
                      port's render engine while one of them appeared correct, because
                      the same payload arriving as a generated record answered the
                      accessor by its own method and the same payload arriving as a map
                      did not. Nothing errored; the block simply vanished. No fixture
                      used a derived accessor at all, which is why it survived.

                - requirement.architectural:
                    name: wireContractStability
                    title: Wire contract stability
                    level: 3
                    status: live
                    statement: >-
                      Every value crosses the wire in one agreed form, whichever port
                      serialised it.
                    counterexample: >-
                      A money amount arriving as a fractional number from one service
                      and as an integer from another, both claiming to implement the
                      same declaration.

                - requirement.architectural:
                    name: registryVocabularyParity
                    title: Registry vocabulary parity
                    level: 3
                    status: live
                    statement: >-
                      Every port registers exactly the same vocabulary, and that is
                      established by matching one manifest rather than by anybody
                      comparing them.
                    counterexample: >-
                      Two ports agreeing on a construct and a third never having
                      registered it, found by an adopter rather than by a gate.

          - requirement.architectural:
              name: maintainability
              title: Maintainability
              level: 2
              status: live
              statement: >-
                Every element of the vocabulary, and every place code names one, is
                declared and reachable by one route, so a change can be made without
                hunting for what else knew about it.
              counterexample: >-
                A construct written as a bare string in one place and as a named
                constant in another, where renaming it still compiles and fails at run
                time.
              children:
                - requirement.architectural:
                    name: strictProvenance
                    title: Strict provenance
                    level: 3
                    status: live
                    statement: >-
                      Every attribute the loader accepts comes from a declared provider,
                      so an invented one fails the load rather than reaching a generator.
                    counterexample: >-
                      A generator emitting output from an attribute nobody ever
                      registered, because nothing along the way refused it.

                - requirement.architectural:
                    name: ownAccessorDiscipline
                    title: Effective-value access
                    level: 3
                    status: live
                    statement: >-
                      Every read of an element's effective value resolves what it
                      inherits, so nothing declared on a parent is silently dropped.
                    counterexample: >-
                      A concrete field built on an abstract one losing its inherited
                      length limit at the moment something asks how long it may be.

                - requirement.architectural:
                    name: namedMetamodelConstants
                    title: Named vocabulary constants
                    level: 3
                    status: live
                    statement: >-
                      Every reference to vocabulary from code goes through a named
                      constant, so a typo fails to compile instead of failing to match.
                    counterexample: >-
                      A misspelled construct name in a comparison that therefore never
                      matches, and a branch that silently never runs.

          - requirement.architectural:
              name: flexibility
              title: Flexibility
              level: 2
              status: live
              statement: >-
                An adopter can take what MetaObjects produced and keep working without
                it.
              counterexample: >-
                A generated artifact that stops compiling the moment the toolchain is
                uninstalled.
              children:
                - requirement.architectural:
                    name: generatedCodeRunsStandalone
                    title: Generated code stands alone
                    level: 3
                    status: live
                    statement: >-
                      Every generated artifact compiles and runs with MetaObjects
                      uninstalled.
                    counterexample: >-
                      An adopter unable to remove the toolchain without their build
                      breaking, so the decision to adopt cannot be reversed.

                - requirement.architectural:
                    name: scaffoldAndOwn
                    title: Scaffold and own
                    level: 3
                    status: live
                    statement: >-
                      Every generator an adopter depends on can be copied into their own
                      repository and changed there.
                    counterexample: >-
                      A change to generated output that an adopter needs and can only
                      get by waiting for a release.

                - requirement.architectural:
                    name: providerExtension
                    title: Provider extension
                    level: 3
                    status: live
                    statement: >-
                      Every way of adding vocabulary is a declared provider, so adding
                      any never requires a fork or switching off a check.
                    counterexample: >-
                      A project needing one extra attribute and having to choose between
                      maintaining a fork and switching off the check that refuses
                      invented ones.

          - requirement.architectural:
              name: reliability
              title: Reliability
              level: 2
              status: live
              statement: >-
                When something is ambiguous or wrong the system refuses rather than
                proceeding, and every step that destroys something has a way back.
              counterexample: >-
                A name that could mean two things, resolved by taking one of them,
                with the choice depending on which was read first.
              children:
                - requirement.architectural:
                    name: failClosedLoading
                    title: Fail-closed loading
                    level: 3
                    status: live
                    statement: >-
                      Every ambiguous or unresolvable declaration is refused at load
                      rather than resolved by guess.
                    counterexample: >-
                      A bare name that exists in two packages binding to one of them, so
                      the model builds against the wrong target and nothing says so.

                - requirement.architectural:
                    name: reversibleMigrations
                    title: Reversible migrations
                    level: 3
                    status: live
                    statement: >-
                      Every emitted migration has a counterpart that undoes it.
                    counterexample: >-
                      A deploy that went wrong with no step available but restoring from
                      backup.

          - requirement.architectural:
              name: security
              title: Security
              level: 2
              status: live
              statement: >-
                An input nobody declared cannot widen what a caller is able to reach.
              counterexample: >-
                A parameter nobody declared reaching the database, because it was on no
                list that would have refused it.
              children:
                - requirement.architectural:
                    name: failClosedFilters
                    title: Fail-closed filters
                    level: 3
                    status: live
                    statement: >-
                      Every filter and sort a caller supplies is checked against a
                      declared allowlist, and anything not on it is refused.
                    counterexample: >-
                      One surface among many accepting a filter field that is on no
                      allowlist, because that one was written by hand.

                - requirement.architectural:
                    name: noCredentialSurface
                    title: No credential surface
                    level: 3
                    status: live
                    statement: >-
                      Nothing MetaObjects generates or stores accepts, holds or
                      transmits a credential.
                    counterexample: >-
                      A generated artifact or a tool's own state carrying a password, so
                      committing the result leaks it.

          - requirement.architectural:
              name: performance
              title: Performance efficiency
              level: 2
              status: live
              statement: >-
                The cost of using MetaObjects where it runs is bounded, and does not
                grow with the size of the model.
              counterexample: >-
                A browser paying to download code that only ever runs on a server.
              children:
                - requirement.architectural:
                    name: browserBundleBudget
                    title: Browser bundle budget
                    level: 3
                    status: live
                    statement: >-
                      Nothing a browser bundle pulls in requires server-only code to be
                      reachable from it.
                    counterexample: >-
                      A single value imported from a package's root dragging a
                      server-only module into the graph, so nothing that uses it can be
                      bundled at all.

                - requirement.architectural:
                    name: promptCachePrefixStability
                    title: Prompt cache prefix stability
                    level: 3
                    status: live
                    statement: >-
                      Every render of an unchanged prompt produces an unchanged prefix.
                    counterexample: >-
                      A release that changes no prompt text and invalidates every cached
                      prefix anyway.

          - requirement.architectural:
              name: interaction
              title: Interaction capability
              level: 2
              status: live
              statement: >-
                A person or an agent that gets something wrong is told what was wrong,
                where, and what would fix it.
              counterexample: >-
                A refusal naming a code and not the thing refused, so the next step is
                to go and read the source of the tool.
              children:
                - requirement.architectural:
                    name: actionableLoaderErrors
                    title: Actionable errors
                    level: 3
                    status: live
                    statement: >-
                      Every refusal names what was wrong, where it was, and what would
                      fix it.
                    counterexample: >-
                      An error naming a construct and not the declaration that used it,
                      so finding the line is a search.

                - requirement.architectural:
                    name: agentContextAccuracy
                    title: Agent context accuracy
                    level: 3
                    status: live
                    statement: >-
                      Every piece of agent-facing context ships vocabulary the loader
                      currently accepts.
                    counterexample: >-
                      A shipped instruction teaching a construct the loader refuses, so
                      following it exactly produces a model that will not load.
                    notes: >-
                      A requirement rather than an editorial nicety because it has
                      failed three separate times — a shipped page or skill teaching
                      vocabulary that had already been retired — and an adopter found it
                      on every one of those occasions. Context that is wrong is worse
                      than context that is missing: it is followed.
