# MetaObjects' own requirements ledger.
#
# This is stock metadata: `requirement.functional` and `requirement.architectural`
# as shipped, loaded by the same loader, under the same strict registry, as any
# adopter's. No custom attributes, no `strict: false`.
#
# `implementedBy` is omitted on every node, deliberately. Its referent is a MODEL
# node and this repository declares no `object.entity` at all — the ledger's subject
# is the solution itself. Omitting it is legal (min=0) and dangle-free, and it is
# why `meta verify` reports WARN_REQUIREMENT_NOTHING_IMPLEMENTS on every live
# functional node. That warning is expected and pinned by
# scripts/check-requirements-ledger.ts. Do not silence it.
#
# Levels are PROBLEM-DOMAIN (the level attribute's byte-gated description: "L1-L3 are
# levels of abstraction and ownership in the problem domain, NOT of code structure").
# No node at L1-L3 may name a package, port, module or deployable.
metadata.root:
  package: metaobjects
  children:
    - requirement.functional:
        name: metaobjects
        title: MetaObjects
        level: 1
        status: live
        statement: >-
          One typed declaration of a domain model drives code, runtime behaviour and
          drift checks across five languages, and what it generates keeps working with
          MetaObjects uninstalled.
        counterexample: >-
          A model that has to be restated by hand in each language, or generated code
          that stops compiling once the toolchain is removed.
        children:
          - requirement.functional:
              name: declare
              title: Declare the model
              level: 2
              status: live
              statement: >-
                A domain model is expressed once, in typed metadata, with enough
                fidelity that every downstream artifact can be derived from it.
              counterexample: >-
                A model fact restated inside a generator, a migration or a
                hand-written type because the metadata cannot say it.
              children:
                - requirement.functional:
                    name: typedFieldVocabulary
                    title: Typed field vocabulary
                    level: 3
                    status: live
                    statement: >-
                      Every value a model can hold has a declared field type that fixes
                      its native type, its storage and its wire form together, so the
                      three cannot disagree.
                    counterexample: >-
                      A price stored as a floating-point number, where adding 0.1 and
                      0.2 does not give 0.3.
                    notes: >-
                      The behaviour-over-storage test is ADR-0037's: ask what a value
                      DOES, not whether it is a string. url and ip became field.uri and
                      field.inet because they carry native types and behaviour; email
                      and hostname stayed plain validated strings.
                    children:
                      - requirement.functional:
                          name: fieldString
                          title: Text
                          level: 4
                          status: live
                          statement: >-
                            A text field holds characters up to a declared
                            maximum length, and attaches no meaning to what
                            they spell beyond what a validator adds.
                          counterexample: >-
                            Text accepted at a length nothing downstream can
                            store, found when the insert fails rather than
                            when it was typed.
                      - requirement.functional:
                          name: fieldInt
                          title: Whole number
                          level: 4
                          status: live
                          statement: >-
                            A whole-number field holds a signed 32-bit
                            integer, in every port and on the wire.
                          counterexample: >-
                            A count that wraps to a negative number on one
                            port and not on another.
                      - requirement.functional:
                          name: fieldLong
                          title: Large whole number
                          level: 4
                          status: live
                          statement: >-
                            A large whole-number field holds a signed 64-bit
                            integer and crosses the wire without a floating-
                            point conversion in between.
                          counterexample: >-
                            An identifier above two to the fifty-third
                            arriving in a browser rounded to a different
                            identifier.
                      - requirement.functional:
                          name: fieldDouble
                          title: Double-precision number
                          level: 4
                          status: live
                          statement: >-
                            A double-precision field holds a binary floating-
                            point number, with the inexactness that implies
                            stated rather than discovered.
                          counterexample: >-
                            A running total accumulated in one, where the sum
                            of the parts no longer equals the whole.
                      - requirement.functional:
                          name: fieldFloat
                          title: Single-precision number
                          level: 4
                          status: live
                          statement: >-
                            A single-precision field holds a narrower binary
                            floating-point number, for values whose provenance
                            is already single-precision.
                          counterexample: >-
                            A value stored at one precision and read back at
                            another, reported as changed by a check that
                            compared the two.
                      - requirement.functional:
                          name: fieldDecimal
                          title: Exact decimal
                          level: 4
                          status: live
                          statement: >-
                            An exact-decimal field holds a base-10 number of
                            declared precision and scale, and never passes
                            through binary floating point to get there.
                          counterexample: >-
                            A tax figure that differs by a cent depending on
                            which language computed it.
                      - requirement.functional:
                          name: fieldBoolean
                          title: Boolean
                          level: 4
                          status: live
                          statement: >-
                            A boolean field holds exactly true or false, and
                            never a third state standing in for absent.
                          counterexample: >-
                            An unanswered question stored as false, so nobody
                            can tell it apart from an answer of no.
                      - requirement.functional:
                          name: fieldDate
                          title: Calendar date
                          level: 4
                          status: live
                          statement: >-
                            A date field holds a day on a calendar — no time,
                            no zone.
                          counterexample: >-
                            A birthday that lands on the previous day for a
                            reader in another region.
                      - requirement.functional:
                          name: fieldTime
                          title: Time of day
                          level: 4
                          status: live
                          statement: >-
                            A time field holds a time of day with no date
                            attached to it.
                          counterexample: >-
                            An opening hour that cannot be declared without
                            inventing a date to hang it on.
                      - requirement.functional:
                          name: fieldTimestamp
                          title: Instant
                          level: 4
                          status: live
                          statement: >-
                            A timestamp field holds an instant, unambiguous
                            across zones, and holds a naive local reading only
                            where the declaration says so.
                          counterexample: >-
                            Two events whose recorded order changes when a
                            server moves region.
                      - requirement.functional:
                          name: fieldObject
                          title: Embedded object
                          level: 4
                          status: live
                          statement: >-
                            An object field holds a declared value object,
                            stored flattened, as a JSON document, or as a
                            subdocument, according to the declaration.
                          counterexample: >-
                            A structured value kept as opaque text, so nothing
                            can query inside it and nothing checks its shape.
                      - requirement.functional:
                          name: fieldMap
                          title: Map
                          level: 4
                          status: live
                          statement: >-
                            A map field holds key-to-value pairs whose keys
                            are not known when the model is written.
                          counterexample: >-
                            An open-ended set of properties modelled as one
                            column per key anyone thought of, so adding a key
                            is a migration.
                      - requirement.functional:
                          name: fieldCurrency
                          title: Money
                          level: 4
                          status: live
                          statement: >-
                            A money field holds an amount as a whole number of
                            the minor units of a declared currency, and is
                            never handled as a fraction.
                          counterexample: >-
                            A price held as a binary fraction, where adding a
                            hundred of them is off by a cent.
                      - requirement.functional:
                          name: fieldEnum
                          title: Enumeration
                          level: 4
                          status: live
                          statement: >-
                            An enumeration field holds one member of a closed
                            declared set, and the member symbol is what the
                            wire and the runtime see whatever the column
                            stores.
                          counterexample: >-
                            A stored value that is no declared member, handed
                            back as though it were one.
                      - requirement.functional:
                          name: fieldUuid
                          title: Unique identifier
                          level: 4
                          status: live
                          statement: >-
                            A unique-identifier field holds a UUID as a value
                            in its own right, not as text that happens to be
                            shaped like one.
                          counterexample: >-
                            Two rows differing only in the letter case of
                            their identifier, treated as two different rows.
                      - requirement.functional:
                          name: fieldUri
                          title: URI
                          level: 4
                          status: live
                          statement: >-
                            A URI field holds an absolute, scheme-bearing
                            address, unless the declaration explicitly relaxes
                            that.
                          counterexample: >-
                            A relative path accepted into a field that
                            everything downstream will try to dereference.
                      - requirement.functional:
                          name: fieldInet
                          title: IP address
                          level: 4
                          status: live
                          statement: >-
                            An address field holds an IP address literal, and
                            a name is never resolved into one on its behalf.
                          counterexample: >-
                            A hostname turned into an address by a lookup
                            while the request was being served, so what got
                            stored depends on when it was stored.
                          notes: >-
                            Observed, and fixed as a defect rather than a
                            preference: two ports resolved a hostname into
                            this field with a blocking lookup on the request
                            path and rewrote the value silently. The stored
                            value then depended on DNS at the moment of
                            writing, which is not a property of the
                            declaration at all.

                - requirement.functional:
                    name: objectTaxonomy
                    title: The object taxonomy
                    level: 3
                    status: live
                    statement: >-
                      Every declared object is exactly one of three kinds — it owns its
                      data, it is a pure shape, or it is derived — and the kind decides
                      what the object is allowed to carry.
                    counterexample: >-
                      A shape meant only for transport that has acquired its own primary
                      key and a writable table.
                    description: >-
                      Covers which kinds exist and what each may hold. How a kind's data
                      is physically stored is persistenceMapping.
                    children:
                      - requirement.functional:
                          name: objectEntity
                          title: Entity
                          level: 4
                          status: live
                          statement: >-
                            An entity owns its data: it has its own identity,
                            a writable place for that data to live, and a
                            lifecycle.
                          counterexample: >-
                            A record that cannot be updated, because nothing
                            declares where it lives or which values identify
                            one of it.
                      - requirement.functional:
                          name: objectValue
                          title: Value object
                          level: 4
                          status: live
                          statement: >-
                            A value object is pure shape — never its own
                            identity, never its own source — constructed by
                            whoever embeds it rather than fetched.
                          counterexample: >-
                            A transport shape that has acquired a primary key,
                            so two copies of one message are now two records.
                      - requirement.functional:
                          name: objectProjection
                          title: Projection
                          level: 4
                          status: live
                          statement: >-
                            A projection is a derived read-only representation
                            whose declared field set IS its exposure: an
                            inclusive list that fails closed.
                          counterexample: >-
                            A view that starts returning a column nobody
                            listed, because the table underneath it gained
                            one.

                - requirement.functional:
                    name: attributeValueTypes
                    title: Attribute value types
                    level: 3
                    status: live
                    statement: >-
                      Every attribute a declaration carries has a declared value type,
                      and a closed set of members where the set is closed, so a wrong
                      value is refused where it was written.
                    counterexample: >-
                      A misspelled status accepted as an ordinary string, silently
                      disabling the check that was supposed to read it.
                    notes: >-
                      Where the members of a closed set are policed decides how many
                      ports can be wrong at once. The requirement status enum is
                      enforced by the loader rather than by a checker precisely so a
                      typo fails to load in every language, instead of passing silently
                      in four of them and being caught in the fifth.
                    children:
                      - requirement.functional:
                          name: attrString
                          title: Text attribute
                          level: 4
                          status: live
                          statement: >-
                            A text attribute carries characters on a
                            declaration and is checked as text when the model
                            loads.
                          counterexample: >-
                            A number written where a name belongs, coerced to
                            text, and emitted into generated code as a name.
                      - requirement.functional:
                          name: attrInt
                          title: Whole-number attribute
                          level: 4
                          status: live
                          statement: >-
                            A whole-number attribute carries a signed 32-bit
                            integer on a declaration.
                          counterexample: >-
                            A length limit written as text, so a limit of 128
                            compares as smaller than a limit of 64.
                      - requirement.functional:
                          name: attrLong
                          title: Large whole-number attribute
                          level: 4
                          status: live
                          statement: >-
                            A large whole-number attribute carries a signed
                            64-bit integer on a declaration.
                          counterexample: >-
                            A bound above the 32-bit range quietly narrowed at
                            load, so the declaration means less than it says.
                      - requirement.functional:
                          name: attrDouble
                          title: Fractional attribute
                          level: 4
                          status: live
                          statement: >-
                            A fractional attribute carries a non-integer
                            number on a declaration.
                          counterexample: >-
                            A ratio written as a fraction and read as a whole
                            number, so a half becomes nothing.
                      - requirement.functional:
                          name: attrBoolean
                          title: Boolean attribute
                          level: 4
                          status: live
                          statement: >-
                            A boolean attribute carries exactly true or false,
                            and text that merely looks like one is not one.
                          counterexample: >-
                            The word false read as a value that is present, so
                            a flag written to switch something off switches it
                            on.
                      - requirement.functional:
                          name: attrClass
                          title: Type-name attribute
                          level: 4
                          status: live
                          statement: >-
                            A type-name attribute carries the name of a type
                            to be bound when code is generated, never resolved
                            by reflection while running.
                          counterexample: >-
                            A type looked up from a string at run time, so the
                            model works under one runtime and fails under a
                            compiled one.
                      - requirement.functional:
                          name: attrProperties
                          title: Free-form properties
                          level: 4
                          status: partial
                          statement: >-
                            A free-form properties attribute carries author-
                            supplied key-value data that the metamodel
                            deliberately does not interpret, so a project can
                            record something of its own without inventing
                            vocabulary.
                          counterexample: >-
                            A project needing one note of its own on a
                            declaration and having to choose between an
                            attribute the loader refuses and switching the
                            refusal off.
                          notes: >-
                            Partial, and the gap is that the type is
                            registered while the attribute that would carry it
                            is registered on NO type — so the chartered escape
                            hatch is unreachable from every node, including
                            this one. No disposition: nobody has ruled on
                            whether to project it onto a wildcard, scope it to
                            a few types, or withdraw the charter. It is
                            recorded here undecided rather than quietly
                            described as working.
                      - requirement.functional:
                          name: attrFilter
                          title: Filter attribute
                          level: 4
                          status: live
                          statement: >-
                            A filter attribute carries a declared predicate as
                            structure, not as a fragment of query language.
                          counterexample: >-
                            A scoping condition written as a string of SQL,
                            meaning one thing on one engine and failing to
                            parse on another.
                      - requirement.functional:
                          name: attrExpression
                          title: Expression attribute
                          level: 4
                          status: live
                          statement: >-
                            An expression attribute carries an expression
                            whose text is the author's and whose placement in
                            the model is the metamodel's.
                          counterexample: >-
                            A derived column's formula living inside a
                            generator instead of the model, so changing it
                            regenerates nothing.
                      - requirement.functional:
                          name: attrIntMap
                          title: Symbol-to-integer map
                          level: 4
                          status: live
                          statement: >-
                            A symbol-to-integer map attribute carries an
                            explicit mapping from declared symbols to numbers,
                            so the correspondence survives the symbols being
                            reordered.
                          counterexample: >-
                            A set of members mapped to storage by position,
                            where inserting one member silently re-labels
                            every row already written.

                - requirement.functional:
                    name: persistenceMapping
                    title: Persistence mapping
                    level: 3
                    status: live
                    statement: >-
                      A declaration says where its data lives and which values identify
                      one row of it, in terms that do not presume a particular database.
                    counterexample: >-
                      An entity whose rows cannot be addressed one at a time, because
                      nothing in the declaration says which values identify one.
                    description: >-
                      Covers the placement of a collection and the identity of a row.
                      How one value is typed and stored is typedFieldVocabulary; which
                      engine the result is emitted for is a codegen concern.
                    children:
                      - requirement.functional:
                          name: sourceRdb
                          title: Relational source
                          level: 4
                          status: live
                          statement: >-
                            A relational source says where an object's data
                            lives, in what kind of place, and in what role,
                            without naming a database engine.
                          counterexample: >-
                            A model that only reveals which engine it assumed
                            when a migration fails against a different one.
                      - requirement.functional:
                          name: identityPrimary
                          title: Primary key
                          level: 4
                          status: live
                          statement: >-
                            A primary key declares which values identify one
                            row and how a new row gets its identifier.
                          counterexample: >-
                            Two rows nothing can tell apart, because nothing
                            declared what makes one row one row.
                      - requirement.functional:
                          name: identitySecondary
                          title: Alternate key
                          level: 4
                          status: live
                          statement: >-
                            An alternate key declares a second unique way to
                            address a row; its uniqueness comes from being
                            that type, never from an attribute somebody
                            remembered to set.
                          counterexample: >-
                            Two customers sharing an email address, because
                            the index meant to prevent it was never unique.
                      - requirement.functional:
                          name: identityReference
                          title: Reference
                          level: 4
                          status: live
                          statement: >-
                            A reference declares that a value points at
                            another object's key, and what becomes of it when
                            that object goes.
                          counterexample: >-
                            A parent deleted and its children left pointing at
                            nothing, because the reference declared no action.
                      - requirement.functional:
                          name: indexLookup
                          title: Lookup index
                          level: 4
                          status: live
                          statement: >-
                            A lookup index declares a non-unique retrieval
                            path. Uniqueness lives in the TYPE, so an index
                            cannot claim it by accident.
                          counterexample: >-
                            A retrieval index that silently enforces
                            uniqueness, so the second row with the same value
                            is refused.

                - requirement.functional:
                    name: relationships
                    title: Relationships
                    level: 3
                    status: live
                    statement: >-
                      A relationship between two objects is declared once, and
                      everything that follows from it — the keys, the join, the
                      traversal — is derived from that one declaration.
                    counterexample: >-
                      The same association stated on both sides, with the two statements
                      disagreeing about which side holds the key.
                    children:
                      - requirement.functional:
                          name: relationshipAssociation
                          title: Association
                          level: 4
                          status: live
                          statement: >-
                            An association declares that two objects refer to
                            one another, with neither owning the other's
                            lifetime.
                          counterexample: >-
                            Deleting a category taking every product in it,
                            because a reference was modelled as ownership.
                      - requirement.functional:
                          name: relationshipAggregation
                          title: Aggregation
                          level: 4
                          status: live
                          statement: >-
                            An aggregation declares that one object groups
                            others which outlive it.
                          counterexample: >-
                            A team disbanded and its members deleted along
                            with it.
                      - requirement.functional:
                          name: relationshipComposition
                          title: Composition
                          level: 4
                          status: live
                          statement: >-
                            A composition declares that one object owns
                            another's lifetime, so the parent going takes the
                            children with it.
                          counterexample: >-
                            An order deleted and its lines left behind,
                            referenced by nothing and still counted by every
                            report.
                          notes: >-
                            The parent side of this contributed no referential
                            action for several releases, so the documented
                            cascade never fired and deleting a parent failed
                            at the database. A relationship that states
                            ownership and emits nothing is the counterexample
                            above, reached by a different route.

                - requirement.functional:
                    name: derivation
                    title: Derivation
                    level: 3
                    status: live
                    statement: >-
                      A value that comes from somewhere else declares where from, and is
                      therefore read-only everywhere it appears.
                    counterexample: >-
                      A stored total that can be written directly, so the total and the
                      rows it sums stop agreeing and nothing notices.
                    description: >-
                      Covers where a derived value comes from and what that makes it.
                      How two objects are connected in the first place is relationships.
                    children:
                      - requirement.functional:
                          name: originPassthrough
                          title: Passthrough
                          level: 4
                          status: live
                          statement: >-
                            A passthrough declares that a value IS a value on
                            another object, and must keep its type across the
                            hop.
                          counterexample: >-
                            A number carried through as text because the two
                            ends disagreed about its type, with nothing saying
                            so.
                      - requirement.functional:
                          name: originAggregate
                          title: Aggregate
                          level: 4
                          status: live
                          statement: >-
                            An aggregate declares a value computed over
                            related rows, optionally scoped, and derived
                            rather than stored.
                          counterexample: >-
                            A count kept in a column and maintained by hand,
                            disagreeing with the rows it counts.
                      - requirement.functional:
                          name: originComputed
                          title: Computed value
                          level: 4
                          status: live
                          statement: >-
                            A computed value declares a value produced by a
                            declared expression over the row it sits on.
                          counterexample: >-
                            A derived figure written directly, so it stops
                            matching the inputs it was derived from.
                      - requirement.functional:
                          name: originFirst
                          title: First of many
                          level: 4
                          status: live
                          statement: >-
                            A first-of-many declares a value taken from one
                            related row, chosen by a declared order rather
                            than by chance.
                          counterexample: >-
                            A latest value that is whichever row the database
                            happened to return.

                - requirement.functional:
                    name: constraints
                    title: Constraints
                    level: 3
                    status: live
                    statement: >-
                      A rule about what a value may be is declared on the model, so the
                      same rule holds at every point a value can arrive.
                    counterexample: >-
                      A value the form refuses and the endpoint behind it accepts.
                    notes: >-
                      Not hypothetical. Until 0.16.0 two ports described their declared
                      constraints and did not enforce them at the wire tier, so a
                      required value could be omitted over HTTP and fail later at the
                      database. Declared-but-decorative is the failure mode this entry
                      exists to forbid.
                    children:
                      - requirement.functional:
                          name: validatorRequired
                          title: Required
                          level: 4
                          status: live
                          statement: >-
                            A required rule says a value must be provided, and
                            for text that emptiness is not providing it.
                          counterexample: >-
                            An empty string accepted for a name, so a record
                            exists with nobody's name on it.
                      - requirement.functional:
                          name: validatorLength
                          title: Length bounds
                          level: 4
                          status: live
                          statement: >-
                            A length rule bounds how long a value may be, and
                            an explicitly declared bound is authoritative over
                            any implicit floor.
                          counterexample: >-
                            A declared minimum of zero raised to one behind
                            the author's back, so provided-but-empty becomes
                            inexpressible.
                          notes: >-
                            The counterexample is the shipped behaviour until
                            0.19.1: every port clamped an authored minimum
                            with max(min, 1) and discarded what the author
                            wrote. An implicit floor that overrides an
                            explicit statement is not a default, it is a
                            contradiction.
                      - requirement.functional:
                          name: validatorRegex
                          title: Pattern
                          level: 4
                          status: live
                          statement: >-
                            A pattern rule constrains a value to a declared
                            expression, matched in FULL rather than anywhere
                            within it.
                          counterexample: >-
                            A pattern meant to accept a postcode accepting any
                            text that contains one.
                      - requirement.functional:
                          name: validatorNumeric
                          title: Numeric bounds
                          level: 4
                          status: live
                          statement: >-
                            A numeric rule bounds the range a number may take.
                          counterexample: >-
                            A negative quantity accepted, so an order adds to
                            stock instead of taking from it.
                      - requirement.functional:
                          name: validatorArray
                          title: Element count
                          level: 4
                          status: live
                          statement: >-
                            An element-count rule bounds how many entries a
                            repeated value may hold.
                          counterexample: >-
                            An unbounded list accepted into a field whose
                            reader only ever looks at the first few.
                      - requirement.functional:
                          name: validatorComparison
                          title: Comparison
                          level: 4
                          status: live
                          statement: >-
                            A comparison rule relates one declared value to
                            another on the same object.
                          counterexample: >-
                            An end date before its start date, stored, and
                            every report that spans them silently empty.
                      - requirement.functional:
                          name: validatorRequiredWhen
                          title: Conditionally required
                          level: 4
                          status: live
                          statement: >-
                            A conditional-requirement rule makes a value
                            mandatory only in a declared circumstance.
                          counterexample: >-
                            A cancellation reason demanded on every order, or
                            on none of them.
                      - requirement.functional:
                          name: validatorPresentIff
                          title: Present together
                          level: 4
                          status: live
                          statement: >-
                            A present-together rule ties two values so that
                            either both are given or neither is.
                          counterexample: >-
                            A latitude stored with no longitude, and a point
                            that cannot be placed.
                      - requirement.functional:
                          name: validatorAtLeastOne
                          title: At least one
                          level: 4
                          status: live
                          statement: >-
                            An at-least-one rule requires that some member of
                            a declared group is given.
                          counterexample: >-
                            A contact saved with neither an email address nor
                            a phone number, and no way to reach them.

                - requirement.functional:
                    name: presentation
                    title: Presentation
                    level: 3
                    status: live
                    statement: >-
                      How a value should be shown to a person is declared beside the
                      value, in terms no particular user interface owns.
                    counterexample: >-
                      A declaration that has to be edited because the interface reading
                      it was rebuilt, even though nothing about the data changed.
                    description: >-
                      Covers what the model may say about presenting a value. What is
                      actually rendered from that is webClient.
                    children:
                      - requirement.functional:
                          name: layoutDataGrid
                          title: Data grid
                          level: 4
                          status: live
                          statement: >-
                            A data grid declares which of an object's fields a
                            tabular view shows, in what order, and how it is
                            sorted and paged before anyone touches it.
                          counterexample: >-
                            A table that gains a column every time the model
                            does, including the ones nobody meant to show.
                      - requirement.functional:
                          name: viewCurrency
                          title: Money display
                          level: 4
                          status: live
                          statement: >-
                            A money display declares that an amount is shown
                            in the conventions of a declared locale, formatted
                            where it is read and never on the server.
                          counterexample: >-
                            An amount formatted once on the server for one
                            locale and shown to a reader in another.
                      - requirement.functional:
                          name: viewText
                          title: Single-line text
                          level: 4
                          status: live
                          statement: >-
                            A single-line text control declares that a value
                            is edited as one line.
                          counterexample: >-
                            A short label given a box the height of a
                            paragraph, because the interface had only the type
                            to guess from.
                      - requirement.functional:
                          name: viewTextarea
                          title: Multi-line text
                          level: 4
                          status: live
                          statement: >-
                            A multi-line text control declares that a value is
                            edited across several lines, to a declared visible
                            height.
                          counterexample: >-
                            A paragraph edited through a one-line control, so
                            the author cannot see what they have written.
                      - requirement.functional:
                          name: viewDate
                          title: Date picker
                          level: 4
                          status: live
                          statement: >-
                            A date control declares that a value is chosen
                            from a calendar.
                          counterexample: >-
                            A date typed as free text, so every reader invents
                            their own format and half of them are ambiguous.
                      - requirement.functional:
                          name: viewMonth
                          title: Month picker
                          level: 4
                          status: live
                          statement: >-
                            A month control declares that a value is chosen as
                            a month within a year, with no day.
                          counterexample: >-
                            A billing period entered as a full date, so twelve
                            possible values become three hundred and sixty-
                            five.
                      - requirement.functional:
                          name: viewHotlink
                          title: Link
                          level: 4
                          status: live
                          statement: >-
                            A link control declares that a value is shown as a
                            link to whatever it addresses.
                          counterexample: >-
                            An address displayed as text nobody can follow
                            without selecting and copying it.
                      - requirement.functional:
                          name: viewDropdown
                          title: Dropdown
                          level: 4
                          status: live
                          statement: >-
                            A dropdown declares that a value is chosen from
                            its declared members in a collapsed list.
                          counterexample: >-
                            A closed set of members offered as free text, so a
                            typo silently becomes a new value.
                      - requirement.functional:
                          name: viewRadio
                          title: Radio group
                          level: 4
                          status: live
                          statement: >-
                            A radio group declares that a value is chosen from
                            its declared members with every option visible at
                            once.
                          counterexample: >-
                            A three-way choice hidden behind a control that
                            shows one option until someone opens it.
                      - requirement.functional:
                          name: viewCheckbox
                          title: Checkbox
                          level: 4
                          status: live
                          statement: >-
                            A checkbox declares that a boolean is set by a
                            single on-or-off control.
                          counterexample: >-
                            A yes-or-no answer offered as a text box, so y,
                            yes and true all arrive and all mean the same
                            thing.
                      - requirement.functional:
                          name: viewNumber
                          title: Number input
                          level: 4
                          status: live
                          statement: >-
                            A number control declares that a value is entered
                            as a number rather than as text that must later
                            parse.
                          counterexample: >-
                            A quantity typed with a thousands separator and
                            refused by the server instead of by the field.
                      - requirement.functional:
                          name: viewPassword
                          title: Masked input
                          level: 4
                          status: live
                          statement: >-
                            A masked control declares that a value is entered
                            without being displayed.
                          counterexample: >-
                            A secret typed in plain sight and left legible in
                            a screen recording.
                      - requirement.functional:
                          name: viewHidden
                          title: Hidden value
                          level: 4
                          status: live
                          statement: >-
                            A hidden control declares that a value travels
                            with a form without being shown or edited.
                          counterexample: >-
                            A value the form has to carry, re-fetched on
                            submit because there was no way to carry it.
                      - requirement.functional:
                          name: viewWeb
                          title: Rich content
                          level: 4
                          status: live
                          statement: >-
                            A rich-content control declares that a value is
                            edited as formatted web content rather than as
                            plain text.
                          counterexample: >-
                            Formatted content edited as plain text, so its
                            markup is shown to the author instead of applied.
                      - requirement.functional:
                          name: viewImage
                          title: Image upload
                          level: 4
                          status: live
                          statement: >-
                            An image control declares that a value is an image
                            a person uploads and crops, stored as an opaque
                            key so no image bytes ever cross the model.
                          counterexample: >-
                            A record carrying its own image bytes, so every
                            list of records carries every picture in it.

                - requirement.functional:
                    name: declaredPrompts
                    title: Declared prompts
                    level: 3
                    status: partial
                    disposition: deferred
                    trackedBy: ["metaobjectsdev/metaobjects#18"]
                    statement: >-
                      What a prompt sends to a model is a declared typed shape, so what
                      it sends is a fact about the model rather than a property of the
                      code that assembled it.
                    counterexample: >-
                      A prompt whose payload has doubled in size with no diff showing
                      it, because its fields were gathered by walking an object at run
                      time.
                    description: >-
                      Covers declaring the payload and the response shape. Rendering
                      them and reading a reply back are under promptConstruction.
                    notes: >-
                      Partial, and the gap is one thing: a declared prompt cannot be
                      discovered and registered by a host over an open protocol, so an
                      LLM host still has to be told by hand what exists. Everything a
                      prompt is declared FROM ships in all five ports. Deferred rather
                      than accepted — it is wanted, it is not scheduled.
                    children:
                      - requirement.functional:
                          name: templatePrompt
                          title: Prompt template
                          level: 4
                          status: live
                          statement: >-
                            A prompt template declares an outbound message to
                            a model: the payload it carries, and — when it
                            expects a structured reply — the shape that reply
                            must take.
                          counterexample: >-
                            A prompt whose payload is assembled somewhere
                            else, so nothing can tell whether a renamed field
                            still reaches it.
                      - requirement.functional:
                          name: templateOutput
                          title: Output template
                          level: 4
                          status: live
                          statement: >-
                            An output template declares a rendering that only
                            ever goes outward. Its axis is DIRECTION, so it
                            has no inbound tier and emits no parser.
                          counterexample: >-
                            An outbound-only template given a parser for a
                            response it will never receive.
                      - requirement.functional:
                          name: templateToolcall
                          title: Tool call template
                          level: 4
                          status: live
                          statement: >-
                            A tool-call template declares a tool a model may
                            invoke by name, with a declared payload and a
                            declared budget for the call.
                          counterexample: >-
                            A tool a model can call whose arguments nothing
                            declares, so a wrong shape is discovered by the
                            tool itself.

                - requirement.functional:
                    name: governanceVocabulary
                    title: Governance vocabulary
                    level: 3
                    status: live
                    statement: >-
                      A capability the solution itself provides can be declared,
                      levelled and checked by the same loader as everything else in the
                      model.
                    counterexample: >-
                      A list of what the product does, kept in a document, that no build
                      reads and that nothing fails when it goes stale.
                    notes: >-
                      This entry is the one being exercised as it is written: the file
                      it sits in is MetaObjects' own ledger, loaded by the shipped
                      loader under the strict registry. If the capability were not real
                      the entry could not exist.
                    children:
                      - requirement.functional:
                          name: requirementFunctional
                          title: Functional requirement
                          level: 4
                          status: live
                          statement: >-
                            A functional requirement states a capability that
                            must EXIST, and its check is existence: it fails
                            when nothing implements it.
                          counterexample: >-
                            A capability everyone believes is there, that
                            nothing builds and no check misses.
                      - requirement.functional:
                          name: requirementArchitectural
                          title: Architectural requirement
                          level: 4
                          status: live
                          statement: >-
                            An architectural requirement states a policy that
                            must hold UNIVERSALLY, and its check is
                            universality: it fails when something is outside
                            it.
                          counterexample: >-
                            A rule declared once, applied to nothing, with
                            every gate reporting green.

                - requirement.functional:
                    name: inheritanceAndReferences
                    title: Inheritance and references
                    level: 3
                    status: live
                    statement: >-
                      A declaration can build on another and name one anywhere in the
                      model unambiguously, and what a name resolves to never depends on
                      the order the declarations were read.
                    counterexample: >-
                      One model resolving a name two different ways on two machines,
                      because the declarations happened to be read in a different order.
                    notes: >-
                      The counterexample is an observed defect, not an invented one: a
                      dotted reference to an inherited member resolved or failed
                      depending on directory-listing order, so the same sources behaved
                      differently under two runtimes. Order-independence is a property
                      of the resolver, which is why it is stated as a promise here.
                    children:
                      - requirement.functional:
                          name: metadataRoot
                          title: Model document
                          level: 4
                          status: live
                          statement: >-
                            A model document is what declarations are written
                            in. It names the package they belong to, which is
                            what lets a bare reference bind locally and a
                            qualified one bind exactly.
                          counterexample: >-
                            One name declared in two packages and a reference
                            to it binding to whichever was read first.

                - requirement.functional:
                    name: authoringFrontEnds
                    title: Authoring front-ends
                    level: 3
                    status: live
                    statement: >-
                      A model can be authored in a form a person is willing to write by
                      hand, and lowered to the one interchange form every port reads by
                      a lowering with exactly one answer.
                    counterexample: >-
                      Two authors writing the same model in the friendlier form and
                      getting two different interchange documents out of it.

          - requirement.functional:
              name: codegen
              title: Codegen
              level: 2
              status: live
              statement: >-
                Every artifact derivable from the declaration is emitted as idiomatic
                per-language code the adopter owns and may hand-edit.
              counterexample: >-
                An adopter hand-writing a foreign key, a CRUD route or a validator
                chain the metadata already describes.
              children:
                - requirement.functional:
                    name: entityAndSchema
                    title: Entity and schema artifacts
                    level: 3
                    status: live
                    statement: >-
                      The types and the table definitions an adopter would otherwise
                      write by hand are emitted from the declaration, in the idiom of
                      the language they land in.
                    counterexample: >-
                      A field added to the declaration and then added a second time, by
                      hand, to a type and to a table.

                - requirement.functional:
                    name: dataAccess
                    title: Data access
                    level: 3
                    status: live
                    statement: >-
                      Reading and writing a declared object is generated as typed code,
                      so a query naming something the model does not have fails before
                      it runs.
                    counterexample: >-
                      A misspelled field reaching the database and coming back as a
                      runtime error, rather than failing where it was written.

                - requirement.functional:
                    name: apiSurface
                    title: API surface
                    level: 3
                    status: live
                    statement: >-
                      The request and response contract for a declared object is
                      generated from the declaration, and is the same contract whichever
                      language serves it.
                    counterexample: >-
                      Two servers built from one declaration disagreeing about whether
                      an absent field means leave it alone or clear it.

                - requirement.functional:
                    name: webClient
                    title: Web client artifacts
                    level: 3
                    status: live
                    statement: >-
                      The forms, grids and typed calls a browser needs are generated
                      from the same declaration that generated what serves them.
                    counterexample: >-
                      A field added to the model, served by the API and missing from the
                      screen, because the two were built from different lists.

                - requirement.functional:
                    name: ownershipAndRegeneration
                    title: Ownership and regeneration
                    level: 3
                    status: live
                    statement: >-
                      Generated output belongs to the adopter: a hand edit inside it
                      survives the next regeneration, and the generator that produced it
                      can be taken over and changed.
                    counterexample: >-
                      A hand edit inside generated output silently gone after the next
                      run.
                    notes: >-
                      What makes the promise keepable is a committed merge base — one
                      hash per generated path, recorded when it was written. Without it
                      a machine that did not generate the output cannot tell a file it
                      wrote from one somebody edited, so a fresh clone or a CI runner
                      overwrites hand edits instead of refusing them by name. The
                      snapshot bodies are ignored; the hashes are committed, and that
                      asymmetry is the whole mechanism.

                - requirement.functional:
                    name: documentationAndAgentContext
                    title: Documentation and agent context
                    level: 3
                    status: live
                    statement: >-
                      The documentation and the agent-facing context an adopter reads
                      are derived from the model, so neither can describe a model that
                      no longer exists.
                    counterexample: >-
                      A shipped page or instruction teaching vocabulary that was retired
                      before it was written.
                    notes: >-
                      The counterexample is the observed failure, three separate times,
                      and an adopter found it every time rather than a gate. That is
                      why it is stated as a capability with a check behind it instead of
                      an editorial habit.

          - requirement.functional:
              name: runtimeMetadata
              title: Runtime metadata
              level: 2
              status: live
              statement: >-
                Metadata loaded at runtime drives behaviour with no generated code in
                the path.
              counterexample: >-
                A dynamic admin screen that needs a code change and a redeploy to show
                a newly declared field.
              children:
                - requirement.functional:
                    name: metadataDrivenCrud
                    title: Metadata-driven CRUD
                    level: 3
                    status: live
                    statement: >-
                      Creating, reading, updating and deleting a declared object works
                      from the declaration alone, with no generated code in the path.
                    counterexample: >-
                      A newly declared object that cannot be stored or listed until
                      something has been generated and deployed.

                - requirement.functional:
                    name: typedQueryAndFilter
                    title: Typed query and filter
                    level: 3
                    status: live
                    statement: >-
                      A caller filters and sorts by declared fields only, and an
                      undeclared or disallowed one is refused rather than ignored.
                    counterexample: >-
                      A filter naming a field nobody declared, quietly returning every
                      row instead of being refused.
                    notes: >-
                      Refused rather than ignored is the load-bearing half. Dropping an
                      unrecognised filter is the fail-OPEN reading: the caller believes
                      the result is narrowed, and it is the whole table.

                - requirement.functional:
                    name: validationEnforcement
                    title: Validation enforcement
                    level: 3
                    status: live
                    statement: >-
                      A declared constraint is applied to a value at the moment it
                      arrives, by the runtime itself.
                    counterexample: >-
                      A value that breaks a declared rule, stored anyway, and found only
                      when something downstream chokes on it.
                    description: >-
                      Covers applying a rule at run time. Declaring the rule once so it
                      can be applied everywhere is constraints, under declare.

                - requirement.functional:
                    name: relationshipNavigation
                    title: Relationship navigation
                    level: 3
                    status: live
                    statement: >-
                      A declared relationship can be traversed at run time, from one row
                      to the rows it relates to, without hand-written join code.
                    counterexample: >-
                      Reaching an order's lines needing a query somebody wrote by hand,
                      restating a join the model already describes.

                - requirement.functional:
                    name: osgiRuntimeVariant
                    title: OSGi runtime variant
                    level: 3
                    status: retired
                    statement: >-
                      Runtime metadata is consumable from inside a dynamic module
                      container that can load and unload providers at runtime.
                    counterexample: >-
                      A metadata registry whose contents depend on which modules happen
                      to be started.
                    notes: >-
                      Retired under ADR-0012. Nothing replaced it, which is why this
                      entry carries no supersededBy: the requirement was withdrawn
                      rather than re-homed. A registry whose vocabulary depends on load
                      order is the opposite of the sealed, deliberately-agreed registry
                      that later became the default.

          - requirement.functional:
              name: driftDetection
              title: Drift detection
              level: 2
              status: live
              statement: >-
                Divergence between the declaration and what was built from it is
                detected before it reaches production.
              counterexample: >-
                A renamed field that silently degrades a prompt, or a column the
                database has and the model does not.
              children:
                - requirement.functional:
                    name: schemaMigration
                    title: Schema migration
                    level: 3
                    status: live
                    statement: >-
                      The difference between a declaration and a live database is
                      computed, and emitted as a migration that can be applied and
                      undone.
                    counterexample: >-
                      A schema change that goes forward and not back, so the only way
                      out of a bad deploy is a restore from backup.

                - requirement.functional:
                    name: codegenDrift
                    title: Codegen drift
                    level: 3
                    status: live
                    statement: >-
                      Generated output that no longer matches the declaration it came
                      from is reported before it is deployed.
                    counterexample: >-
                      A field renamed in the model months ago, still spelled the old way
                      in code that ships, with every build green.

                - requirement.functional:
                    name: promptAndTemplateDrift
                    title: Prompt and template drift
                    level: 3
                    status: live
                    statement: >-
                      A prompt that names something the model no longer has is caught
                      when it is built, not when it is sent.
                    counterexample: >-
                      A renamed field leaving a hole in a prompt, so the model answers a
                      question it was never fully asked and nothing reports an error.

                - requirement.functional:
                    name: liveDatabaseVerification
                    title: Live database verification
                    level: 3
                    status: live
                    statement: >-
                      A running database can be checked against the declaration without
                      changing it.
                    counterexample: >-
                      The only way to learn whether production matches the model being
                      to run a migration against production.

                - requirement.functional:
                    name: perPortMigrationEngines
                    title: Per-port migration engines
                    level: 3
                    status: retired
                    statement: >-
                      Each language port computes and applies its own schema migrations
                      from the declaration.
                    counterexample: >-
                      Two ports emitting different migrations for one declaration, so
                      the database that results depends on who ran the tool.
                    supersededBy: metaobjects.driftDetection.schemaMigration
                    notes: >-
                      Retired under ADR-0015: schema migration is owned by one shared
                      engine. The per-port engines were removed, and with them the
                      dev/test auto-create path, so runtime data access is now pure
                      data access. Do not reintroduce a second migration engine in any
                      port — the counterexample above is what it produces.

          - requirement.functional:
              name: promptConstruction
              title: Prompt construction
              level: 2
              status: live
              statement: >-
                A prompt is code: its payload is a typed projection, its text is
                external and provider-resolved, and its rendering is deterministic.
              counterexample: >-
                A whitespace change silently breaking an exact-prefix prompt-cache hit.
              children:
                - requirement.functional:
                    name: payloadProjection
                    title: Payload projection
                    level: 3
                    status: live
                    statement: >-
                      What a prompt sends is a declared projection, authoritative over
                      anything that could be derived instead, so growth in what is sent
                      arrives as a diff.
                    counterexample: >-
                      A payload that grew by a whole nested object nobody chose, because
                      a field's shape was taken from where its value comes from rather
                      than from what was declared.
                    notes: >-
                      The counterexample is an observed defect. Three ports typed a
                      payload field from its origin child instead of its declaration,
                      and the worst arm substituted the related entity for the curated
                      shape the author had declared — invisible in review, because the
                      metadata still read as curated.

                - requirement.functional:
                    name: deterministicRender
                    title: Deterministic render
                    level: 3
                    status: live
                    statement: >-
                      One payload and one template render to the same bytes on every run
                      and in every language.
                    counterexample: >-
                      Two runs over one unchanged payload producing different bytes, so
                      the exact-prefix cache hit is lost and the same prompt is paid for
                      twice.

                - requirement.functional:
                    name: parserOnReceipt
                    title: Parser on receipt
                    level: 3
                    status: live
                    statement: >-
                      A declared response shape is parsed and checked when a reply
                      arrives, rather than trusted.
                    counterexample: >-
                      A reply that is nearly the right shape read as though it were the
                      right shape, carrying a wrong value onward as if it had been
                      checked.

          - requirement.functional:
              name: governTheStandard
              title: Govern the standard
              level: 2
              status: live
              statement: >-
                The registered vocabulary is identical in every port, changes only
                deliberately, and records its retirements so they cannot be revived by
                accident.
              counterexample: >-
                One attribute meaning three different things in three ports while every
                gate reports green.
              children:
                - requirement.functional:
                    name: crossLanguageIdentity
                    title: Cross-language identity
                    level: 3
                    status: live
                    statement: >-
                      One declaration means the same thing in every language, and a
                      divergence fails a gate rather than reaching an adopter.
                    counterexample: >-
                      One model producing two different column names on one machine,
                      depending on which language's runtime wrote the row.
                    notes: >-
                      Measured, not feared. A single attribute naming a column was found
                      to mean three different things across the ports at once — one used
                      it as a field name, one ignored it entirely and hardcoded a
                      convention, one resolved it literally — while every port
                      byte-matched the shared vocabulary manifest throughout. The
                      manifest proves the ports SPELL the vocabulary identically and is
                      blind to what they DO with it. This entry is the promise that
                      blindness needs.

                - requirement.functional:
                    name: vocabularyLifecycle
                    title: Vocabulary lifecycle
                    level: 3
                    status: live
                    statement: >-
                      Vocabulary enters deliberately and leaves recorded, with a
                      mechanical path from the retired form to the one that replaced it.
                    counterexample: >-
                      A construct that was deliberately removed, rebuilt by someone who
                      believed they were extending it, because nothing they could read
                      said it had been taken out on purpose.
                    notes: >-
                      The counterexample is the one claim a controlled round did not
                      refute: against a deliberately-retired capability, model-only
                      agents flagged it 0 times out of 24 — every run proposing to extend
                      it, each believing it was reusing rather than reviving — while
                      arms with a ledger caught it 19 of 40. Under half is not a
                      guarantee, and the entry does not claim to be one.

                - requirement.functional:
                    name: versioningAndRelease
                    title: Versioning and release
                    level: 3
                    status: live
                    statement: >-
                      What metadata may say and what the software offers are separate
                      contracts with separate version numbers, and a change to either
                      moves its own.
                    counterexample: >-
                      A change to what metadata may say, shipped under a number that only
                      ever promised a change to the software.

    - requirement.architectural:
        name: quality
        title: Quality obligations
        level: 1
        status: live
        statement: >-
          MetaObjects meets stated, checkable quality obligations, organised by the
          ISO/IEC 25010:2023 product quality characteristics it actually bears.
        counterexample: >-
          A quality claim in a README that no gate, corpus or test can falsify.
        notes: >-
          Organised by ISO/IEC 25010:2023's product quality characteristics. Two of
          the nine are deliberately absent: functional suitability, because the
          functional capability map is that characteristic in full; and safety,
          because nothing in scope can cause physical harm. The tree shape follows
          the arc42 / ATAM quality tree, whose leaves are concrete falsifiable
          scenarios — which is what statement plus counterexample already is.
        children:
          - requirement.architectural:
              name: compatibility
              title: Compatibility
              level: 2
              status: live
              statement: >-
                One declaration produces the same meaning in every language port and on
                every wire, so a consumer can change ports without changing behaviour.
              counterexample: >-
                One attribute meaning three different things in three ports while every
                gate reports green.
              notes: >-
                The dominant characteristic for this project and the one the entire
                conformance apparatus exists to defend. Author its children first.
              children:
                - requirement.architectural:
                    name: byteIdenticalRendering
                    title: Byte-identical rendering
                    level: 3
                    status: live
                    statement: >-
                      Every port renders one declared template over one payload to the
                      same bytes.
                    counterexample: >-
                      One payload rendering differently depending on which language
                      produced it, with no error raised anywhere.
                    notes: >-
                      The failure this guards against is quiet by nature. A conditional
                      section over a derived accessor was dropped silently by every
                      port's render engine while one of them appeared correct, because
                      the same payload arriving as a generated record answered the
                      accessor by its own method and the same payload arriving as a map
                      did not. Nothing errored; the block simply vanished. No fixture
                      used a derived accessor at all, which is why it survived.

                - requirement.architectural:
                    name: wireContractStability
                    title: Wire contract stability
                    level: 3
                    status: live
                    statement: >-
                      Every value crosses the wire in one agreed form, whichever port
                      serialised it.
                    counterexample: >-
                      A money amount arriving as a fractional number from one service
                      and as an integer from another, both claiming to implement the
                      same declaration.

                - requirement.architectural:
                    name: registryVocabularyParity
                    title: Registry vocabulary parity
                    level: 3
                    status: live
                    statement: >-
                      Every port registers exactly the same vocabulary, and that is
                      established by matching one manifest rather than by anybody
                      comparing them.
                    counterexample: >-
                      Two ports agreeing on a construct and a third never having
                      registered it, found by an adopter rather than by a gate.

          - requirement.architectural:
              name: maintainability
              title: Maintainability
              level: 2
              status: live
              statement: >-
                Every element of the vocabulary, and every place code names one, is
                declared and reachable by one route, so a change can be made without
                hunting for what else knew about it.
              counterexample: >-
                A construct written as a bare string in one place and as a named
                constant in another, where renaming it still compiles and fails at run
                time.
              children:
                - requirement.architectural:
                    name: strictProvenance
                    title: Strict provenance
                    level: 3
                    status: live
                    statement: >-
                      Every attribute the loader accepts comes from a declared provider,
                      so an invented one fails the load rather than reaching a generator.
                    counterexample: >-
                      A generator emitting output from an attribute nobody ever
                      registered, because nothing along the way refused it.

                - requirement.architectural:
                    name: ownAccessorDiscipline
                    title: Effective-value access
                    level: 3
                    status: live
                    statement: >-
                      Every read of an element's effective value resolves what it
                      inherits, so nothing declared on a parent is silently dropped.
                    counterexample: >-
                      A concrete field built on an abstract one losing its inherited
                      length limit at the moment something asks how long it may be.

                - requirement.architectural:
                    name: namedMetamodelConstants
                    title: Named vocabulary constants
                    level: 3
                    status: live
                    statement: >-
                      Every reference to vocabulary from code goes through a named
                      constant, so a typo fails to compile instead of failing to match.
                    counterexample: >-
                      A misspelled construct name in a comparison that therefore never
                      matches, and a branch that silently never runs.

          - requirement.architectural:
              name: flexibility
              title: Flexibility
              level: 2
              status: live
              statement: >-
                An adopter can take what MetaObjects produced and keep working without
                it.
              counterexample: >-
                A generated artifact that stops compiling the moment the toolchain is
                uninstalled.
              children:
                - requirement.architectural:
                    name: generatedCodeRunsStandalone
                    title: Generated code stands alone
                    level: 3
                    status: live
                    statement: >-
                      Every generated artifact compiles and runs with MetaObjects
                      uninstalled.
                    counterexample: >-
                      An adopter unable to remove the toolchain without their build
                      breaking, so the decision to adopt cannot be reversed.

                - requirement.architectural:
                    name: scaffoldAndOwn
                    title: Scaffold and own
                    level: 3
                    status: live
                    statement: >-
                      Every generator an adopter depends on can be copied into their own
                      repository and changed there.
                    counterexample: >-
                      A change to generated output that an adopter needs and can only
                      get by waiting for a release.

                - requirement.architectural:
                    name: providerExtension
                    title: Provider extension
                    level: 3
                    status: live
                    statement: >-
                      Every way of adding vocabulary is a declared provider, so adding
                      any never requires a fork or switching off a check.
                    counterexample: >-
                      A project needing one extra attribute and having to choose between
                      maintaining a fork and switching off the check that refuses
                      invented ones.

          - requirement.architectural:
              name: reliability
              title: Reliability
              level: 2
              status: live
              statement: >-
                When something is ambiguous or wrong the system refuses rather than
                proceeding, and every step that destroys something has a way back.
              counterexample: >-
                A name that could mean two things, resolved by taking one of them,
                with the choice depending on which was read first.
              children:
                - requirement.architectural:
                    name: failClosedLoading
                    title: Fail-closed loading
                    level: 3
                    status: live
                    statement: >-
                      Every ambiguous or unresolvable declaration is refused at load
                      rather than resolved by guess.
                    counterexample: >-
                      A bare name that exists in two packages binding to one of them, so
                      the model builds against the wrong target and nothing says so.

                - requirement.architectural:
                    name: reversibleMigrations
                    title: Reversible migrations
                    level: 3
                    status: live
                    statement: >-
                      Every emitted migration has a counterpart that undoes it.
                    counterexample: >-
                      A deploy that went wrong with no step available but restoring from
                      backup.

          - requirement.architectural:
              name: security
              title: Security
              level: 2
              status: live
              statement: >-
                An input nobody declared cannot widen what a caller is able to reach.
              counterexample: >-
                A parameter nobody declared reaching the database, because it was on no
                list that would have refused it.
              children:
                - requirement.architectural:
                    name: failClosedFilters
                    title: Fail-closed filters
                    level: 3
                    status: live
                    statement: >-
                      Every filter and sort a caller supplies is checked against a
                      declared allowlist, and anything not on it is refused.
                    counterexample: >-
                      One surface among many accepting a filter field that is on no
                      allowlist, because that one was written by hand.

                - requirement.architectural:
                    name: noCredentialSurface
                    title: No credential surface
                    level: 3
                    status: live
                    statement: >-
                      Nothing MetaObjects generates or stores accepts, holds or
                      transmits a credential.
                    counterexample: >-
                      A generated artifact or a tool's own state carrying a password, so
                      committing the result leaks it.

          - requirement.architectural:
              name: performance
              title: Performance efficiency
              level: 2
              status: live
              statement: >-
                The cost of using MetaObjects where it runs is bounded, and does not
                grow with the size of the model.
              counterexample: >-
                A browser paying to download code that only ever runs on a server.
              children:
                - requirement.architectural:
                    name: browserBundleBudget
                    title: Browser bundle budget
                    level: 3
                    status: live
                    statement: >-
                      Nothing a browser bundle pulls in requires server-only code to be
                      reachable from it.
                    counterexample: >-
                      A single value imported from a package's root dragging a
                      server-only module into the graph, so nothing that uses it can be
                      bundled at all.

                - requirement.architectural:
                    name: promptCachePrefixStability
                    title: Prompt cache prefix stability
                    level: 3
                    status: live
                    statement: >-
                      Every render of an unchanged prompt produces an unchanged prefix.
                    counterexample: >-
                      A release that changes no prompt text and invalidates every cached
                      prefix anyway.

          - requirement.architectural:
              name: interaction
              title: Interaction capability
              level: 2
              status: live
              statement: >-
                A person or an agent that gets something wrong is told what was wrong,
                where, and what would fix it.
              counterexample: >-
                A refusal naming a code and not the thing refused, so the next step is
                to go and read the source of the tool.
              children:
                - requirement.architectural:
                    name: actionableLoaderErrors
                    title: Actionable errors
                    level: 3
                    status: live
                    statement: >-
                      Every refusal names what was wrong, where it was, and what would
                      fix it.
                    counterexample: >-
                      An error naming a construct and not the declaration that used it,
                      so finding the line is a search.

                - requirement.architectural:
                    name: agentContextAccuracy
                    title: Agent context accuracy
                    level: 3
                    status: live
                    statement: >-
                      Every piece of agent-facing context ships vocabulary the loader
                      currently accepts.
                    counterexample: >-
                      A shipped instruction teaching a construct the loader refuses, so
                      following it exactly produces a model that will not load.
                    notes: >-
                      A requirement rather than an editorial nicety because it has
                      failed three separate times — a shipped page or skill teaching
                      vocabulary that had already been retired — and an adopter found it
                      on every one of those occasions. Context that is wrong is worse
                      than context that is missing: it is followed.
