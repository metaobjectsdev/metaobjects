metadata:
  package: acme::purchasing
  children:
    - object.entity:
        name: Ticket
        children:
          - source.rdb: { table: tickets }
          - field.long: { name: id }
          - identity.primary: { name: pk, fields: [id] }
          - field.enum:
              name: status
              values: [open, closed]
              default: closed
              children:
                - transition.action: { name: close, from: [open], to: closed }
