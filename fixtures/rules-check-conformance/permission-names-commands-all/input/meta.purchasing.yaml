metadata:
  package: acme::purchasing
  children:
    - object.entity:
        name: PurchaseRequest
        children:
          - source.rdb: { table: purchase_requests }
          - field.long: { name: id }
          - identity.primary: { name: pk, fields: [id] }
          - field.enum:
              name: status
              values: [draft, submitted, approved, rejected]
              default: draft
              children:
                - transition.action: { name: submit, from: [draft], to: submitted }
                - transition.action: { name: approve, from: [submitted], to: approved }
                - transition.action: { name: reject, from: [submitted], to: rejected, permission: purchasing.review }
                - transition.action: { name: approveFirst, from: [submitted], to: submitted }
                - transition.action: { name: withdraw, from: [submitted], to: draft, public: true }
    - object.value:
        name: DecisionInput
        children:
          - field.long: { name: requestId, extends: PurchaseRequest.id }
          - field.string: { name: comment }
    - object.projection:
        name: RequestSummary
        children:
          - source.rdb: { kind: view, view: v_request_summary }
          - field.long: { name: id, extends: PurchaseRequest.id }
          - identity.primary: { name: pk, extends: PurchaseRequest.pk }
    - api.operational:
        name: Purchasing
        children:
          - operation.command:
              name: decide
              inputRef: DecisionInput
              transitions: [approve, approveFirst]
          - operation.command:
              name: escalate
              inputRef: DecisionInput
              permission: purchasing.escalate
          - operation.query: { name: openRequests, outputRef: RequestSummary, many: true, public: true }
          - operation.query: { name: requestSummary, outputRef: RequestSummary }
