metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    # A flat policy: no level, and none is demanded.
    - requirement.architectural:
        name: Identified
        status: live
        statement: Every row is addressed by a uuid.
        counterexample: A row keyed by a name.
        implementedBy: [Order]

    - requirement.functional:
        name: Recorded
        level: 4
        status: live
        statement: An order is recorded when it is placed.
        counterexample: A placed order has no row.
        implementedBy: [Order]
        children:
          # A flat policy under a levelled parent: it has no level to compare.
          - requirement.architectural:
              name: Addressable
              status: live
              statement: An order is addressed by one stable key.
              counterexample: An order that cannot be pointed at.
              implementedBy: [Order]
