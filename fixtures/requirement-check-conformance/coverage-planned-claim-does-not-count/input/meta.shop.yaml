metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    - object.entity:
        name: Customer
        children:
          - field.uuid: { name: id }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.functional:
        name: Recorded
        level: 4
        status: live
        statement: An order is recorded when it is placed.
        counterexample: A placed order has no row.
        implementedBy: [Order]

    - requirement.functional:
        name: Enrolled
        level: 4
        status: planned
        statement: A customer is recorded once.
        counterexample: Two rows for one customer.
        implementedBy: [Customer]
