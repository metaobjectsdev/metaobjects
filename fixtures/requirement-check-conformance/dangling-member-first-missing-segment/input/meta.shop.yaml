metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.functional:
        name: Recorded
        level: 4
        status: live
        statement: An order is recorded when it is placed.
        counterexample: A placed order has no row.
        implementedBy: [Order]
        children:
          # Order.reference resolves; it has no member named display.
          - requirement.functional:
              name: Readable
              level: 5
              status: live
              statement: An order reference is shown in a form a person can read.
              counterexample: A reference shown as a raw string.
              implementedBy: [Order.reference.display]
          # Order has no member named shipment, so carrier is never reached.
          - requirement.functional:
              name: Tracked
              level: 5
              status: live
              statement: An order names the carrier that ships it.
              counterexample: A shipped order with no carrier.
              implementedBy: [Order.shipment.carrier]
