metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.functional:
        name: Shop
        level: 1
        status: live
        statement: A customer can buy from the shop.
        counterexample: A customer who cannot place an order.
        children:
          - requirement.functional:
              name: Orders
              level: 3
              status: live
              statement: Every placed order is kept.
              counterexample: A placed order that is lost.
              children:
                - requirement.functional:
                    name: Recorded
                    level: 4
                    status: live
                    statement: An order is recorded when it is placed.
                    counterexample: A placed order has no row.
                    implementedBy: [Order]
                # A misspelt path.
                - requirement.functional:
                    name: Faxed
                    level: 4
                    status: retired
                    supersededBy: Shop.Orders.Recordd
                    statement: An order confirmation is sent by fax.
                    counterexample: A confirmed order with no fax.
                # A name is not an address: the requirement is Shop.Orders.Recorded.
                - requirement.functional:
                    name: Telexed
                    level: 4
                    status: retired
                    supersededBy: Recorded
                    statement: An order confirmation is sent by telex.
                    counterexample: A confirmed order with no telex.
                # An object, not a requirement.
                - requirement.functional:
                    name: Posted
                    level: 4
                    status: retired
                    supersededBy: Order
                    statement: An order confirmation is sent by post.
                    counterexample: A confirmed order with no letter.
