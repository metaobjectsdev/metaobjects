metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    # Below the ladder.
    - requirement.functional:
        name: Shop
        level: 0
        status: live
        statement: A customer can buy from the shop.
        counterexample: A customer who cannot place an order.
        children:
          - requirement.functional:
              name: Recorded
              level: 4
              status: live
              statement: An order is recorded when it is placed.
              counterexample: A placed order has no row.
              implementedBy: [Order]

    # Above the ladder.
    - requirement.functional:
        name: Audited
        level: 6
        status: live
        statement: Every row records who changed it.
        counterexample: A row with no change attribution.
        implementedBy: [Order]
