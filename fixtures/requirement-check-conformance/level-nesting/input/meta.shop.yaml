metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.functional:
        name: Recorded
        level: 4
        status: live
        statement: An order is recorded when it is placed.
        counterexample: A placed order has no row.
        implementedBy: [Order]
        children:
          # The same level as its parent.
          - requirement.functional:
              name: Duplicated
              level: 4
              status: live
              statement: An order is recorded once.
              counterexample: Two rows for one order.
              implementedBy: [Order]
          - requirement.functional:
              name: Quotable
              level: 5
              status: live
              statement: An order carries a reference the customer can quote.
              counterexample: An order nobody can quote back.
              implementedBy: [Order.reference]
              children:
                # A level above its parent.
                - requirement.functional:
                    name: Inverted
                    level: 4
                    status: live
                    statement: An order can be found again by its reference.
                    counterexample: A reference that finds no order.
                    implementedBy: [Order]
