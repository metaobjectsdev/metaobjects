metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.functional:
        name: Recorded
        level: 4
        status: live
        disposition: accepted
        statement: An order is recorded when it is placed.
        counterexample: A placed order has no row.
        implementedBy: [Order]

    - requirement.functional:
        name: Faxed
        level: 4
        status: retired
        disposition: deferred
        trackedBy: [SHOP-12]
        statement: An order confirmation is sent by fax.
        counterexample: A confirmed order with no fax.
