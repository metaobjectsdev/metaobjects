metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - field.string: { name: reference }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.architectural:
        name: Identified
        status: live
        statement: Every row is addressed by a uuid.
        counterexample: A row keyed by a name.
        implementedBy: [Order]

    - requirement.architectural:
        name: Audited
        status: live
        statement: Every row records who changed it.
        counterexample: A row with no change attribution.

    - requirement.architectural:
        name: Attributed
        status: partial
        statement: Every row records when it changed.
        counterexample: A row with no change time.

    # Levelled at the link floor: it may name the model, and it names nothing.
    - requirement.architectural:
        name: Encrypted
        level: 4
        status: live
        statement: Every stored row is encrypted at rest.
        counterexample: A backup that opens in a text editor.
