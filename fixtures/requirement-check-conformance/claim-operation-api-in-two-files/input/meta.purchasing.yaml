# The api.operational "Purchasing" is declared here and again in meta.purchasing-review.yaml.
# Two declarations of one API merge under the loader's general rule (WARN_DUPLICATE_DECLARATION
# across files), so a claim on an operation from either file resolves on the merged API.
metadata:
  package: acme::purchasing
  children:
    - object.entity:
        name: PurchaseRequest
        children:
          - source.rdb: { table: purchase_requests }
          - field.long: { name: id }
          - identity.primary: { name: pk, fields: [id] }
          - field.enum:
              name: status
              values: [draft, submitted, approved]
              default: draft
              children:
                - transition.action: { name: submit, from: [draft], to: submitted }
                - transition.action: { name: approve, from: [submitted], to: approved }
    - object.value:
        name: ApproveInput
        children:
          - field.long: { name: requestId, extends: PurchaseRequest.id }
    - api.operational:
        name: Purchasing
        children:
          - operation.command:
              name: decide
              inputRef: ApproveInput
              transitions: [approve]
              permission: purchasing.decide

    - requirement.functional:
        name: Approval
        level: 4
        status: live
        statement: A submitted request can be approved.
        counterexample: A submitted request nobody can approve.
        implementedBy: [PurchaseRequest]
        children:
          - requirement.functional:
              name: Decided
              level: 5
              status: live
              statement: A reviewer decides a submitted request.
              counterexample: A request that waits forever.
              implementedBy: [Purchasing.decide]
          - requirement.functional:
              name: Reviewed
              level: 5
              status: live
              statement: A reviewer lists what waits for review.
              counterexample: A queue nobody can see.
              implementedBy: [Purchasing.pending]
