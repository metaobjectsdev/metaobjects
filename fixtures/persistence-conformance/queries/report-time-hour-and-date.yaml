name: report-time-hour-and-date
description: |
  AssetActivity buckets Asset.recordedAt by hour and Asset.asOfDate by week.

  recordedAt is an instant (TIMESTAMPTZ); its hour bucket is itself an instant, so it is
  bucketed in UTC and read back in the instant wire form "2026-05-04T03:00:00Z".
  asOfDate is a field.date; its week bucket is a DATE, the Monday that starts the ISO week.
  2026-05-03 is a Sunday, so its week starts 2026-04-27; 2026-05-04 is a Monday.
seed-data: |
  INSERT INTO "assets"
    ("id","ownerId","externalId","payload","recordedAt","observedAt","asOfDate","atTime")
  VALUES
    ('11111111-1111-4111-8111-111111111111',
     'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
     '22222222-2222-4222-8222-222222222222',
     '{"k": 1}',
     '2026-05-04T03:30:00Z', '2026-05-04T03:30:00', '2026-05-03', '03:30:00'),
    ('33333333-3333-4333-8333-333333333333',
     '44444444-4444-4444-8444-444444444444',
     '55555555-5555-4555-8555-555555555555',
     '{"k": 2}',
     '2026-05-04T03:45:00Z', '2026-05-04T03:45:00', '2026-05-03', '03:45:00'),
    ('66666666-6666-4666-8666-666666666666',
     '77777777-7777-4777-8777-777777777777',
     '88888888-8888-4888-8888-888888888888',
     '{"k": 3}',
     '2026-05-04T04:10:00Z', '2026-05-04T04:10:00', '2026-05-04', '04:10:00');
queries:
  - name: by-hour-and-week
    op: list
    entity: AssetActivity
    sort: [{ field: recordedAtHour, dir: asc }]
    expect:
      - { recordedAtHour: "2026-05-04T03:00:00Z", asOfDateWeek: "2026-04-27", assets: "2" }
      - { recordedAtHour: "2026-05-04T04:00:00Z", asOfDateWeek: "2026-05-04", assets: "1" }
