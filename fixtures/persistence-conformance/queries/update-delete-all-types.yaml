name: update-delete-all-types
description: |
  The UPDATE + DELETE write gate, complementing the INSERT-only
  `roundtrip-all-types.yaml` keystone. Where `roundtrip` proves the runtime WRITE
  codec re-encodes every field subtype on INSERT, this scenario proves:

    1. UPDATE re-encodes a representative field of EVERY tricky subtype through the
       runtime write path (NOT raw SQL): string / int / long / double / float /
       decimal / boolean / date / time / timestamp / timestamp(tz) / currency /
       enum / uuid / object(jsonb). The read-back (`op: get`) asserts the
       wire-normalized post-update values — so a port whose UPDATE codec differs
       from its INSERT codec (a common per-port hazard: PATCH paths often skip the
       type coercion the INSERT path applies) is caught here.
    2. DELETE removes the row by primary key (`op: delete` → boolean true), and a
       follow-up `op: get` by the same PK returns NULL (the row is gone).

  Unlike the AllTypes roundtrip keystone (server-generated `gen_random_uuid` PK),
  this scenario SEEDS a row with a FIXED, known PK via `seed-data` so the later
  `update` / `get` / `delete` / `get` ops can all address it by id. The seeded
  initial values differ from the updated values in every field so the assertions
  prove the UPDATE actually changed each one (no false-pass on an unchanged field).

  Tricky update re-encodes asserted:
    - decimal: "1.000000" → "987.654321" (canonical, trailing zeros stripped).
    - currency: integer minor units on the wire (BIGINT) → "250000".
    - long: a full int64 above 2^53 (8000000000000000001) written as a numeric
      STRING — proves the UPDATE path keeps 64-bit fidelity, not just INSERT.
    - uuid: written upper-case, reads back lowercase-canonical.
    - timestamp / timestamptz / time: millisecond components re-encoded.
    - boolean: true → false.
    - enum: LOW → HIGH (CHECK-constrained).
    - object(jsonb): a new object re-serialized with sorted keys.

  PORT STATUS: TS only until the per-port write-codec units land. The
  `op: update` / `op: delete` verbs require the port's runtime write path
  (`om.update` / `om.delete` equivalents). The Java / Kotlin / Python / C#
  runners implement these verbs in their SP-H write-codec units; their integration
  runners will FAIL this scenario until then — expected. Do not delete it;
  implement the verbs, then run it green.

seed-data: |
  INSERT INTO "all_types" (
    "id", "sVal", "iVal", "lVal", "dVal", "fVal", "decVal", "bVal",
    "dateVal", "timeVal", "tsVal", "tsTzVal", "moneyVal", "enumVal", "uuidVal",
    "uriVal", "inetVal", "inet6Val", "settings"
  ) VALUES (
    '22222222-2222-4222-8222-222222222222',
    'before', 1, 1, 0.5, 0.5, 1.000000, true,
    '2020-01-01', '00:00:00', '2020-01-01T00:00:00', '2020-01-01T00:00:00Z',
    100, 'LOW', '11111111-1111-4111-8111-111111111111',
    'urn:example:before', '10.0.0.1', 'fe80::abcd',
    '{"theme":"light","notify":false,"retries":0}'
  );

queries:
  - name: update-every-subtype
    description: |
      PATCH a representative field of every subtype through the runtime write path;
      the result is the updated row (returned by om.update).
    op: update
    entity: AllTypes
    by: { id: "22222222-2222-4222-8222-222222222222" }
    data:
      sVal: "after"
      iVal: 99
      # full int64 above 2^53 as a numeric string — UPDATE keeps 64-bit fidelity.
      lVal: "8000000000000000001"
      dVal: 0.125
      fVal: 1.5
      decVal: "987.654321"
      bVal: false
      dateVal: "2026-06-03"
      timeVal: "14:30:00.123"
      tsVal: "2026-06-03T14:30:00.123"
      tsTzVal: "2026-06-03T14:30:00.123Z"
      moneyVal: 250000
      enumVal: "HIGH"
      uuidVal: "AAAAAAAA-AAAA-4AAA-8AAA-AAAAAAAAAAAA"
      uriVal: "https://example.com/after?x=1"
      inetVal: "192.168.10.20"
      inet6Val: "2001:db8::dead:beef"
      settings: { theme: "dark", notify: true, retries: 7 }
    expect:
      id: "22222222-2222-4222-8222-222222222222"
      sVal: "after"
      iVal: 99
      lVal: "8000000000000000001"
      dVal: "0.125"
      fVal: "1.5"
      decVal: "987.654321"
      bVal: false
      dateVal: "2026-06-03"
      timeVal: "14:30:00.123"
      tsVal: "2026-06-03T14:30:00.123"
      tsTzVal: "2026-06-03T14:30:00.123Z"
      moneyVal: "250000"
      enumVal: "HIGH"
      uuidVal: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      uriVal: "https://example.com/after?x=1"
      inetVal: "192.168.10.20"
      inet6Val: "2001:db8::dead:beef"
      settings: { notify: true, retries: 7, theme: "dark" }
      # labels (array-of-VO jsonb) is neither seeded nor updated here → reads back null.
      labels: null

  - name: read-back-after-update
    description: re-read by PK; the persisted row carries every re-encoded value.
    op: get
    entity: AllTypes
    by: { id: "22222222-2222-4222-8222-222222222222" }
    expect:
      id: "22222222-2222-4222-8222-222222222222"
      sVal: "after"
      iVal: 99
      lVal: "8000000000000000001"
      dVal: "0.125"
      fVal: "1.5"
      decVal: "987.654321"
      bVal: false
      dateVal: "2026-06-03"
      timeVal: "14:30:00.123"
      tsVal: "2026-06-03T14:30:00.123"
      tsTzVal: "2026-06-03T14:30:00.123Z"
      moneyVal: "250000"
      enumVal: "HIGH"
      uuidVal: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      uriVal: "https://example.com/after?x=1"
      inetVal: "192.168.10.20"
      inet6Val: "2001:db8::dead:beef"
      settings: { notify: true, retries: 7, theme: "dark" }
      # labels (array-of-VO jsonb) is neither seeded nor updated here → reads back null.
      labels: null

  - name: delete-by-pk
    description: DELETE the row through the runtime; true = a row was deleted.
    op: delete
    entity: AllTypes
    by: { id: "22222222-2222-4222-8222-222222222222" }
    expect: true

  - name: read-after-delete-is-absent
    description: the row is gone — a get by the same PK returns null.
    op: get
    entity: AllTypes
    by: { id: "22222222-2222-4222-8222-222222222222" }
    expect: null
