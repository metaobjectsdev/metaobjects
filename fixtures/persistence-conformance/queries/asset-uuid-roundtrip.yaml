name: asset-uuid-roundtrip
description: |
  R6 Plan 2a/2b — uuid values round-trip lowercase-canonically and the
  server-side gen_random_uuid() default populates an unspecified PK.

  Seed three assets:
    - two with EXPLICIT ids (one upper-case, one lower-case) → both must come
      back lowercase-canonical (the normalization contract for UUID).
    - one with NO id supplied → Postgres fills it via gen_random_uuid(); we
      assert it exists (count = 3) and that its generated id is a valid,
      non-null uuid by fetching it back through a non-uuid lookup column.

  payload is a @dbColumnType:jsonb open-JSON column; jsonb re-serializes with
  sorted keys per the normalization contract.

  recordedAt is a @dbColumnType:timestamp_with_tz column (TIMESTAMPTZ). Its
  native physical type (`timestamp with time zone`) is asserted port-
  independently in migrations/asset-native-column-types.yaml. Here it is seeded
  at exact-UTC instants and asserted in the canonical UTC Z form per
  normalization.md. observedAt/asOfDate/atTime are the @required temporal
  columns on Asset (full wire-type coverage lives in normalization-wire-types.yaml).

  SP-A: the FIRST seeded row carries a sub-second (millisecond) component on its
  temporal columns (recordedAt/observedAt/atTime), proving the fractional wire
  form; the SECOND row stays whole-second, proving the omit-the-dot-when-zero
  rule (a whole-second value stays "...:00" / "...:00Z", never "...:00.000").
seed-data: |
  INSERT INTO "assets"
    ("id","ownerId","externalId","payload","recordedAt","observedAt","asOfDate","atTime")
  VALUES
    ('11111111-1111-4111-8111-111111111111',
     'AAAAAAAA-AAAA-4AAA-8AAA-AAAAAAAAAAAA',
     '22222222-2222-4222-8222-222222222222',
     '{"b": 2, "a": 1}',
     '2026-05-30T14:30:00.123Z', '2026-05-30T14:30:00.123', '2026-05-30', '14:30:00.123'),
    ('33333333-3333-4333-8333-333333333333',
     '44444444-4444-4444-8444-444444444444',
     '55555555-5555-4555-8555-555555555555',
     '{"k": "v"}',
     '2026-05-30T15:00:00Z', '2026-05-30T15:00:00', '2026-05-30', '15:00:00');
  INSERT INTO "assets"
    ("ownerId","externalId","payload","recordedAt","observedAt","asOfDate","atTime")
  VALUES
    ('66666666-6666-4666-8666-666666666666',
     '77777777-7777-4777-8777-777777777777',
     '{"generated": true}',
     '2026-05-30T16:00:00Z', '2026-05-30T16:00:00', '2026-05-30', '16:00:00');

queries:
  - name: get-asset-by-explicit-uppercase-id-roundtrips-lowercase
    op: get
    entity: Asset
    by: { id: "11111111-1111-4111-8111-111111111111" }
    expect:
      id: "11111111-1111-4111-8111-111111111111"
      ownerId: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      externalId: "22222222-2222-4222-8222-222222222222"
      payload: { a: 1, b: 2 }
      recordedAt: "2026-05-30T14:30:00.123Z"
      observedAt: "2026-05-30T14:30:00.123"
      asOfDate: "2026-05-30"
      atTime: "14:30:00.123"

  - name: list-assets-with-explicit-ids-by-owner-eq
    op: list
    entity: Asset
    filter: { ownerId: { eq: "44444444-4444-4444-8444-444444444444" } }
    sort: [{ field: id, dir: asc }]
    expect:
      - id: "33333333-3333-4333-8333-333333333333"
        ownerId: "44444444-4444-4444-8444-444444444444"
        externalId: "55555555-5555-4555-8555-555555555555"
        payload: { k: "v" }
        recordedAt: "2026-05-30T15:00:00Z"
        observedAt: "2026-05-30T15:00:00"
        asOfDate: "2026-05-30"
        atTime: "15:00:00"

  # The third row is inserted WITHOUT an id: the INSERT only succeeds because the
  # PK carries a server-side gen_random_uuid() DEFAULT (a NOT NULL PK with no
  # default would reject the row). count = 3 is therefore the generation proof.
  - name: count-all-three-including-server-generated-pk
    op: count
    entity: Asset
    expect: 3
