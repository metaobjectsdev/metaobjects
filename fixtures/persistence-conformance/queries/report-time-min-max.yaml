name: report-time-min-max
description: |
  AssetDays buckets Asset.recordedAt by day (an instant, bucketed in UTC) and
  Asset.asOfDate by month (a date), and aggregates min/max over a TIMESTAMPTZ, a naive
  TIMESTAMP and a DATE, plus a distinct count of a uuid.

    a1 owner A  recorded 2026-05-04T03:30Z  observed 03:30  asOf 2026-05-03
    a2 owner B  recorded 2026-05-04T22:10Z  observed 22:10  asOf 2026-05-20
    a3 owner B  recorded 2026-05-04T23:30Z  observed 23:30  asOf 2026-06-01
    a4 owner A  recorded 2026-05-05T00:15Z  observed 00:15  asOf 2026-04-30
  a1 and a2 share (2026-05-04, 2026-05-01) with two distinct owners.
seed-data: |
  INSERT INTO "assets"
    ("id","ownerId","externalId","payload","recordedAt","observedAt","asOfDate","atTime")
  VALUES
    ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
     NULL, NULL, '2026-05-04T03:30:00.000Z', '2026-05-04 03:30:00', '2026-05-03', '03:30:00'),
    ('22222222-2222-4222-8222-222222222222', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
     NULL, NULL, '2026-05-04T22:10:00.000Z', '2026-05-04 22:10:00', '2026-05-20', '22:10:00'),
    ('33333333-3333-4333-8333-333333333333', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
     NULL, NULL, '2026-05-04T23:30:00.000Z', '2026-05-04 23:30:00', '2026-06-01', '23:30:00'),
    ('44444444-4444-4444-8444-444444444444', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
     NULL, NULL, '2026-05-05T00:15:00.000Z', '2026-05-05 00:15:00', '2026-04-30', '00:15:00');
queries:
  - name: min-max-over-temporal-columns
    op: list
    entity: AssetDays
    sort: [{ field: recordedAtDay, dir: asc }, { field: asOfDateMonth, dir: asc }]
    expect:
      - { recordedAtDay: "2026-05-04", asOfDateMonth: "2026-05-01", assets: "2", owners: "2",
          firstRecorded: "2026-05-04T03:30:00Z", lastObserved: "2026-05-04T22:10:00", lastAsOf: "2026-05-20" }
      - { recordedAtDay: "2026-05-04", asOfDateMonth: "2026-06-01", assets: "1", owners: "1",
          firstRecorded: "2026-05-04T23:30:00Z", lastObserved: "2026-05-04T23:30:00", lastAsOf: "2026-06-01" }
      - { recordedAtDay: "2026-05-05", asOfDateMonth: "2026-04-01", assets: "1", owners: "1",
          firstRecorded: "2026-05-05T00:15:00Z", lastObserved: "2026-05-05T00:15:00", lastAsOf: "2026-04-30" }
