name: m2n-directed-self-join
description: |
  FR-017 directed self-join: Person —following→ Person through the Follow
  junction. Both junction references resolve to Person, so @sourceRefField
  ("followerId") names the source side; the other reference (followeeId) is the
  target. Direction matters: (1→2) means 1 follows 2, NOT the reverse.

  PORT STATUS: TS only (Unit 5). Other ports land in Units 6–9.
seed-data: |
  INSERT INTO "people" ("id", "name") VALUES
    (1, 'Alice'), (2, 'Bob'), (3, 'Carol'), (4, 'Dave');
  INSERT INTO "follows" ("followerId", "followeeId") VALUES
    (1, 2), (1, 3), (2, 1);
queries:
  - name: alice-follows-bob-and-carol
    op: relate
    entity: Person
    by: { id: 1 }
    relation: following
    expect:
      - { id: "2", name: "Bob" }
      - { id: "3", name: "Carol" }

  - name: bob-follows-only-alice
    op: relate
    entity: Person
    by: { id: 2 }
    relation: following
    expect:
      - { id: "1", name: "Alice" }

  - name: carol-follows-nobody-direction-matters
    op: relate
    entity: Person
    by: { id: 3 }
    relation: following
    expect: []
