name: measurement-floats
description: |
  REAL (field.float, float4) and DOUBLE PRECISION (field.double, float8) round-trip
  as canonical plain-decimal strings — no trailing zeros, no exponential notation.
  Seed values are in-band dyadic rationals (exactly representable in float4/float8),
  so every port must surface byte-identical normalized rows regardless of its driver's
  native float type. This is the end-to-end proof of the R6 float-fidelity contract.

  preciseKg is a field.decimal NUMERIC(9,4) column (SP-A). NUMERIC round-trips as a
  canonical no-trailing-zeros string: PG retains the column scale (so 12.5 is stored
  as 12.5000) but the wire form strips trailing zeros AND the bare decimal point when
  the value is integer-valued. The seeds exercise every edge: trailing-zero strip
  (12.5000 → "12.5"), integer-valued (100.0000 → "100"), high-scale (0.0001 →
  "0.0001"), and a negative (-3.2500 → "-3.25"). All are within NUMERIC(9,4).
seed-data: |
  INSERT INTO "measurements" ("id", "tempC", "massKg", "preciseKg") VALUES
    (1,  1.5,  0.125,  12.5000),
    (2, -3.25, 1234.5, -3.2500),
    (3,  0.5,  0.0625, 100.0000),
    (4,  0.25, 0.5,    0.0001);
queries:
  - name: get-measurement-1
    op: get
    entity: Measurement
    by: { id: 1 }
    expect: { id: "1", tempC: "1.5", massKg: "0.125", preciseKg: "12.5" }

  - name: list-measurements-by-id-asc
    op: list
    entity: Measurement
    sort: [{ field: id, dir: asc }]
    expect:
      - { id: "1", tempC: "1.5",   massKg: "0.125",  preciseKg: "12.5" }
      - { id: "2", tempC: "-3.25", massKg: "1234.5", preciseKg: "-3.25" }
      - { id: "3", tempC: "0.5",   massKg: "0.0625", preciseKg: "100" }
      - { id: "4", tempC: "0.25",  massKg: "0.5",    preciseKg: "0.0001" }
