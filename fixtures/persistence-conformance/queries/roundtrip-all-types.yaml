name: roundtrip-all-types
description: |
  SP-H Unit 3 — the WRITE round-trip keystone. Every other query scenario seeds
  via raw SQL and only READS; this one INSERTS a row through the port's runtime /
  ORM write path (NOT raw SQL), reads it back by primary key, and asserts the
  read-back normalized values equal the wire-normalized `expect`. It therefore
  exercises the WRITE codec + the read path together — the structural complement
  to the read gate, and the gate that would have caught the byte/short hole, the
  Java timestamp-write hazard, and native-uuid-write.

  `op: roundtrip` carries an `insert:` block (the field-keyed row to write in the
  runtime's native authoring forms) and an `expect:` block (the wire-normalized
  read-back). The AllTypes entity covers EVERY persistable field subtype in one
  row:

    string / int / long / double / float / decimal / boolean /
    date / time / timestamp / timestamp(tz) / currency / enum / uuid /
    object(@objectRef, jsonb storage)

  Tricky wire cases asserted here:
    - decimal: exact, canonical (no trailing zeros) → "123.456".
    - currency: integer minor units on the wire (a BIGINT) → "199900".
    - uuid: written upper-case, reads back lowercase-canonical.
    - id (uuid PK): NOT supplied on insert; gen_random_uuid() fills it, the
      runtime returns it, and the read-back is by that generated PK — so a
      server-generated PK is exercised on the write path too.
    - temporal: tsVal (TIMESTAMP, no Z) + tsTzVal (TIMESTAMPTZ, always Z) +
      timeVal (TIME) carry millisecond components; the whole-second omit-the-dot
      rule is proven by the second query (a row with no sub-second part).
    - float/double: in-band dyadic non-integers (1.5 / 0.125) so every port
      renders the identical minimal plain-decimal string (see normalization.md).
    - object: a typed @objectRef value-object stored as JSONB → re-serialized
      with sorted keys.

queries:
  - name: write-all-subtypes-then-read-back
    op: roundtrip
    entity: AllTypes
    insert:
      sVal: "hello"
      iVal: 42
      # A BIGINT well above 2^32 (exercises the BIGINT→string READ contract) but
      # within JS's safe-integer range so the WRITE value round-trips exactly.
      # Writing the FULL int64 max (9223372036854775807) requires the runtime to
      # accept a bigint/string on write — a per-port write-codec concern deferred
      # to the SP-H write-codec units; the keystone covers the subtype + the
      # read-as-string contract here.
      lVal: 9007199254740991
      dVal: 0.125
      fVal: 1.5
      decVal: "123.456"
      bVal: true
      dateVal: "2026-06-03"
      timeVal: "14:30:00.123"
      tsVal: "2026-06-03T14:30:00.123"
      tsTzVal: "2026-06-03T14:30:00.123Z"
      moneyVal: 199900
      enumVal: "MEDIUM"
      uuidVal: "AAAAAAAA-AAAA-4AAA-8AAA-AAAAAAAAAAAA"
      settings: { theme: "dark", notify: true, retries: 3 }
    expect:
      sVal: "hello"
      iVal: 42
      lVal: "9007199254740991"
      dVal: "0.125"
      fVal: "1.5"
      decVal: "123.456"
      bVal: true
      dateVal: "2026-06-03"
      timeVal: "14:30:00.123"
      tsVal: "2026-06-03T14:30:00.123"
      tsTzVal: "2026-06-03T14:30:00.123Z"
      moneyVal: "199900"
      enumVal: "MEDIUM"
      uuidVal: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      settings: { notify: true, retries: 3, theme: "dark" }

  - name: write-whole-second-temporal-then-read-back
    op: roundtrip
    entity: AllTypes
    insert:
      sVal: "second row"
      iVal: -7
      lVal: 1
      dVal: -3.25
      fVal: 0.5
      decVal: "100"
      bVal: false
      dateVal: "2026-01-15"
      timeVal: "09:00:00"
      tsVal: "2026-01-15T09:00:00"
      tsTzVal: "2026-01-15T09:00:00Z"
      moneyVal: 0
      enumVal: "LOW"
      uuidVal: "11111111-1111-4111-8111-111111111111"
      settings: { theme: "light", notify: false, retries: 0 }
    expect:
      sVal: "second row"
      iVal: -7
      lVal: "1"
      dVal: "-3.25"
      fVal: "0.5"
      decVal: "100"
      bVal: false
      dateVal: "2026-01-15"
      timeVal: "09:00:00"
      tsVal: "2026-01-15T09:00:00"
      tsTzVal: "2026-01-15T09:00:00Z"
      moneyVal: "0"
      enumVal: "LOW"
      uuidVal: "11111111-1111-4111-8111-111111111111"
      settings: { notify: false, retries: 0, theme: "light" }
