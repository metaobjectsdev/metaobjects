name: roundtrip-self-fk
description: |
  1:N self-referential FK write round-trip. Node has id (PK) + a NULLABLE
  parentId → Node.id (declared via `identity.reference fkParent → Node`). Two
  roundtrips: a root node (parentId omitted → NULL) and a child whose parentId
  points at a seeded parent row. Each INSERTs through the port's runtime / ORM
  write codec (NOT raw SQL), reads the row back by primary key, and asserts the
  wire-normalized read-back (the PK is excluded from the comparison per the
  op:roundtrip contract).

  This is the ONLY 1:N self-referential FK in the corpus — every other self-
  reference is an M:N junction self-join (FR-018 @symmetric / @sourceRefField).
  A 1:N self-FK is realized as a plain scalar column (field.long) whose FK-ness
  is declared by identity.reference; every port emits it as a scalar (TS/Drizzle
  alone emits a column-level `.references()`, which is why only TS could hit a
  self-import bug). The round-trip gates that the write codec handles a nullable
  self-FK uniformly: NULL stays NULL, and a non-null value satisfies the self-
  referencing FK constraint.

  Wire rule: parentId is field.long → BIGINT → a numeric STRING on the wire
  ("1000"); a NULL FK stays JSON null.

# Seed a parent row so the child roundtrip's parentId references a real id.
# id 1000 is well above the IDENTITY sequence start, so the runtime auto-id
# inserts below it never collide (the column is GENERATED BY DEFAULT, so the
# explicit seed value does not advance the sequence).
seed-data: |
  INSERT INTO "nodes" ("id", "label", "parentId") VALUES (1000, 'root', NULL);

queries:
  - name: write-root-node-null-parent
    op: roundtrip
    entity: Node
    insert:
      label: "another root"
      # parentId omitted → NULL self-FK
    expect:
      label: "another root"
      parentId: null

  - name: write-child-node-with-parent
    op: roundtrip
    entity: Node
    insert:
      label: "child"
      parentId: 1000
    expect:
      label: "child"
      parentId: "1000"
