name: projection-passthrough
description: |
  ProgramView is a pure passthrough projection over the v_program VIEW (id,
  title, status passed through from Program). Every port must read it through
  its persistence layer — the view DDL is generated by TS into
  schema.postgres.sql; this exercises the runtime passthrough-read path.

  id is field.long → BIGINT → string per normalization.md.
seed-data: |
  INSERT INTO "programs" ("id","title","priceCents","status","createdAt") VALUES
    (1, 'Foundations', 4999, 'PUBLISHED', '2026-05-01T10:00:00');
queries:
  - name: read-passthrough-view
    op: get
    entity: ProgramView
    by: { id: 1 }
    expect: { id: "1", title: "Foundations", status: "PUBLISHED" }
