name: m2n-symmetric-self-join
description: |
  FR-017 symmetric self-join: Person —friends→ Person through the Friendship
  junction with @symmetric: true. Single-row storage, union on read: a row
  (a,b) answers the friends lookup from BOTH a and b. The resolver queries
  WHERE personAId = X OR personBId = X and, per row, takes the column that is
  NOT the source id as the friend id.

  PORT STATUS: TS only (Unit 5). Other ports land in Units 6–9.
seed-data: |
  INSERT INTO "people" ("id", "name") VALUES
    (1, 'Alice'), (2, 'Bob'), (3, 'Carol'), (4, 'Dave');
  INSERT INTO "friendships" ("personAId", "personBId") VALUES
    (1, 2), (3, 1), (2, 4);
queries:
  - name: alice-friends-both-directions
    description: stored as (1,2) forward and (3,1) reverse — both surface for Alice.
    op: relate
    entity: Person
    by: { id: 1 }
    relation: friends
    expect:
      - { id: "2", name: "Bob" }
      - { id: "3", name: "Carol" }

  - name: bob-friends-union
    description: stored as (1,2) reverse and (2,4) forward.
    op: relate
    entity: Person
    by: { id: 2 }
    relation: friends
    expect:
      - { id: "1", name: "Alice" }
      - { id: "4", name: "Dave" }

  - name: dave-single-friend
    op: relate
    entity: Person
    by: { id: 4 }
    relation: friends
    expect:
      - { id: "2", name: "Bob" }
