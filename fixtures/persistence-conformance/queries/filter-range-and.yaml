name: filter-range-and
description: |
  Range query via the top-level `and` combinator — composes child filters with
  AND. Required because applying two ops to one field (e.g. priceCents.gte +
  priceCents.lte) produces ambiguous behavior across runtimes: TS's
  query-builder takes only the first op, while a naive C# adapter would AND
  both. The DSL pins one shape: explicit `and: [...]`.
seed-data: |
  INSERT INTO "programs" ("id", "title", "priceCents", "status", "created_ts") VALUES
    (1, 'Foundations', 4999, 'PUBLISHED', '2026-05-01T10:00:00'),
    (2, 'Strength',    7999, 'PUBLISHED', '2026-05-02T10:00:00'),
    (3, 'Mobility',    2999, 'DRAFT',     '2026-05-03T10:00:00'),
    (4, 'Archived',    1999, 'ARCHIVED',  '2026-05-04T10:00:00');
queries:
  - name: price-range-3k-to-7k
    op: list
    entity: Program
    filter:
      and:
        - { priceCents: { gte: 3000 } }
        - { priceCents: { lte: 7000 } }
    sort: [{ field: id, dir: asc }]
    expect:
      - { id: "1", title: "Foundations", priceCents: "4999", status: "PUBLISHED", createdAt: "2026-05-01T10:00:00" }

  - name: published-and-cheaper-than-5k
    op: list
    entity: Program
    filter:
      and:
        - { status: { eq: "PUBLISHED" } }
        - { priceCents: { lt: 5000 } }
    sort: [{ field: id, dir: asc }]
    expect:
      - { id: "1", title: "Foundations", priceCents: "4999", status: "PUBLISHED", createdAt: "2026-05-01T10:00:00" }
