name: report-relative-date
description: |
  RecentPrograms carries the report-level filter createdAt >= start of day (now - P30D). A relative-date
  value is evaluated by the database when the view is QUERIED (the view calls now()), not
  when it is created, so a fixed seed date would rot as the clock advances. The seed is
  therefore clock-relative: seed SQL is executed raw, so an expression is legal. One
  program is three days old (inside the window), the other sixty (outside). Two more sit
  one minute either side of the window start, which `startOf: day` puts at 00:00 UTC thirty
  days ago: without the truncation the first would be cut off; the second pins that the
  window reaches no further back than that midnight.
  created_ts is a naive timestamp holding the UTC wall clock.
seed-data: |
  INSERT INTO "programs" ("id","title","priceCents","status","created_ts") VALUES
    (1, 'Fresh', 1000, 'PUBLISHED', (now() AT TIME ZONE 'UTC') - INTERVAL '3 days'),
    (2, 'Stale', 2000, 'PUBLISHED', (now() AT TIME ZONE 'UTC') - INTERVAL '60 days'),
    (3, 'EdgeIn', 3000, 'PUBLISHED', date_trunc('day', (now() AT TIME ZONE 'UTC') - INTERVAL '30 days') + INTERVAL '1 minute'),
    (4, 'EdgeOut', 4000, 'PUBLISHED', date_trunc('day', (now() AT TIME ZONE 'UTC') - INTERVAL '30 days') - INTERVAL '1 minute');
seed-data-engine:
  sqlite: |
    INSERT INTO "programs" ("id","title","priceCents","status","created_ts") VALUES
      (1, 'Fresh', 1000, 'PUBLISHED', strftime('%Y-%m-%dT%H:%M:%fZ','now','-3 days')),
      (2, 'Stale', 2000, 'PUBLISHED', strftime('%Y-%m-%dT%H:%M:%fZ','now','-60 days')),
      (3, 'EdgeIn', 3000, 'PUBLISHED', strftime('%Y-%m-%dT%H:%M:%fZ','now','-30 days','start of day','+1 minutes')),
      (4, 'EdgeOut', 4000, 'PUBLISHED', strftime('%Y-%m-%dT%H:%M:%fZ','now','-30 days','start of day','-1 minutes'));
  mysql: |
    INSERT INTO `programs` (`id`,`title`,`priceCents`,`status`,`created_ts`) VALUES
      (1, 'Fresh', 1000, 'PUBLISHED', UTC_TIMESTAMP(3) - INTERVAL 3 DAY),
      (2, 'Stale', 2000, 'PUBLISHED', UTC_TIMESTAMP(3) - INTERVAL 60 DAY),
      (3, 'EdgeIn', 3000, 'PUBLISHED', DATE(UTC_TIMESTAMP(3) - INTERVAL 30 DAY) + INTERVAL 1 MINUTE),
      (4, 'EdgeOut', 4000, 'PUBLISHED', DATE(UTC_TIMESTAMP(3) - INTERVAL 30 DAY) - INTERVAL 1 MINUTE);
queries:
  - name: only-programs-inside-the-calendar-window-count
    op: list
    entity: RecentPrograms
    expect:
      - { programs: "2" }
