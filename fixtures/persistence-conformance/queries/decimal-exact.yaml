name: decimal-exact
description: |
  A field.decimal is exact on the wire (ADR-0019 Amendment 1, W1 and W2): written as a string
  through the runtime's write codec, read back as a canonical string (plain notation, no trailing
  fraction zeros, zero as "0"), and compared exactly by a filter. `12345678901234567.89` has 19
  significant digits, more than a double holds, so a runtime that converts a decimal to a binary
  float anywhere on the path (a filter operand, a bound parameter, a read) returns the wrong row
  or the wrong text. Only Postgres and MySQL hold a decimal exactly (W4), so only they run it;
  decimal-exact-15 is the 15-digit subset every engine runs.
engines: [postgres, mysql]
queries:
  - name: insert-1
    op: roundtrip
    entity: Entry
    insert: { id: 1, bucket: A, amount: "0.1", flagged: true }
    expect: { bucket: A, amount: "0.1", flagged: true }
  - name: insert-2
    op: roundtrip
    entity: Entry
    insert: { id: 2, bucket: A, amount: "0.2", flagged: false }
    expect: { bucket: A, amount: "0.2", flagged: false }
  - name: insert-3
    op: roundtrip
    entity: Entry
    insert: { id: 3, bucket: B, amount: "12345678901234567.89", flagged: false }
    expect: { bucket: B, amount: "12345678901234567.89", flagged: false }
  - name: insert-4
    op: roundtrip
    entity: Entry
    insert: { id: 4, bucket: B, amount: "0.01", flagged: true }
    expect: { bucket: B, amount: "0.01", flagged: true }
  - name: insert-5
    op: roundtrip
    entity: Entry
    insert: { id: 5, bucket: C, amount: "-0.0000000001", flagged: false }
    expect: { bucket: C, amount: "-0.0000000001", flagged: false }
  - name: insert-6
    op: roundtrip
    entity: Entry
    insert: { id: 6, bucket: C, amount: "-12345678.987654321", flagged: false }
    expect: { bucket: C, amount: "-12345678.987654321", flagged: false }
  - name: insert-7
    op: roundtrip
    entity: Entry
    insert: { id: 7, bucket: D, amount: "100.50", flagged: false }
    expect: { bucket: D, amount: "100.5", flagged: false }
  - name: insert-8
    op: roundtrip
    entity: Entry
    insert: { id: 8, bucket: D, amount: "99.5", flagged: false }
    expect: { bucket: D, amount: "99.5", flagged: false }
  - name: insert-9
    op: roundtrip
    entity: Entry
    insert: { id: 9, bucket: E, amount: "0.0000000000", flagged: false }
    expect: { bucket: E, amount: "0", flagged: false }
  - name: insert-10
    op: roundtrip
    entity: Entry
    insert: { id: 10, bucket: E, amount: null, flagged: false }
    expect: { bucket: E, amount: null, flagged: false }
  - name: insert-11
    op: roundtrip
    entity: Entry
    insert: { id: 11, bucket: F, amount: null, flagged: false }
    expect: { bucket: F, amount: null, flagged: false }
  - name: list-reads-canonical-strings
    op: list
    entity: Entry
    sort: [{ field: id, dir: asc }]
    expect:
      - { id: "1", bucket: A, amount: "0.1", flagged: true }
      - { id: "2", bucket: A, amount: "0.2", flagged: false }
      - { id: "3", bucket: B, amount: "12345678901234567.89", flagged: false }
      - { id: "4", bucket: B, amount: "0.01", flagged: true }
      - { id: "5", bucket: C, amount: "-0.0000000001", flagged: false }
      - { id: "6", bucket: C, amount: "-12345678.987654321", flagged: false }
      - { id: "7", bucket: D, amount: "100.5", flagged: false }
      - { id: "8", bucket: D, amount: "99.5", flagged: false }
      - { id: "9", bucket: E, amount: "0", flagged: false }
      - { id: "10", bucket: E, amount: null, flagged: false }
      - { id: "11", bucket: F, amount: null, flagged: false }
  - name: filter-eq-is-exact
    op: list
    entity: Entry
    filter: { amount: { eq: "12345678901234567.89" } }
    expect:
      - { id: "3", bucket: B, amount: "12345678901234567.89", flagged: false }
  - name: filter-gt-is-exact
    op: list
    entity: Entry
    filter: { amount: { gt: "12345678901234567.8" } }
    expect:
      - { id: "3", bucket: B, amount: "12345678901234567.89", flagged: false }
  - name: filter-eq-ignores-trailing-zeros
    op: list
    entity: Entry
    filter: { amount: { eq: "100.5000" } }
    expect:
      - { id: "7", bucket: D, amount: "100.5", flagged: false }
  - name: filter-eq-takes-an-exponent
    op: list
    entity: Entry
    filter: { amount: { eq: "1.005e2" } }
    expect:
      - { id: "7", bucket: D, amount: "100.5", flagged: false }
  - name: write-rejects-garbage
    op: create
    entity: Entry
    expect-error: true
    data: { id: 99, bucket: Z, amount: "12abc", flagged: false }
    expect: null
