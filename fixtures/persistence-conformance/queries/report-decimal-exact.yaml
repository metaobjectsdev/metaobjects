name: report-decimal-exact
description: |
  A report over a decimal is exact on the wire (ADR-0019 Amendment 1): a sum of 12345678901234567.89
  and 0.01 is "12345678901234567.9", an average keeps its digits, an empty sum is null unless the
  measure declares @default (then "0"), and a ratio with a zero denominator is null. The view is
  computed by the engine, so this is the engine's own decimal arithmetic read back through the
  runtime. Postgres and MySQL only (W4); report-decimal-exact-15 is the subset every engine runs.
engines: [postgres, mysql]
seed-data: |
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (1, 'A', 0.1, TRUE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (2, 'A', 0.2, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (3, 'B', 12345678901234567.89, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (4, 'B', 0.01, TRUE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (5, 'C', -0.0000000001, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (6, 'C', -12345678.987654321, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (7, 'D', 100.50, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (8, 'D', 99.5, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (9, 'E', 0.0000000000, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (10, 'E', NULL, FALSE);
  INSERT INTO "entries" ("id","bucket","amount","flagged") VALUES (11, 'F', NULL, FALSE);
queries:
  - name: entry-totals
    op: list
    entity: EntryTotals
    sort: [{ field: bucket, dir: asc }]
    expect:
      - { bucket: A, entries: "2", total: "0.3", totalOrZero: "0.3", mean: "0.15", top: "0.2", flaggedShare: "0.5", perFlagged: "2" }
      - { bucket: B, entries: "2", total: "12345678901234567.9", totalOrZero: "12345678901234567.9", mean: "6172839450617283.95", top: "12345678901234567.89", flaggedShare: "0.5", perFlagged: "2" }
      - { bucket: C, entries: "2", total: "-12345678.9876543211", totalOrZero: "-12345678.9876543211", mean: "-6172839.49382716055", top: "-0.0000000001", flaggedShare: "0", perFlagged: null }
      - { bucket: D, entries: "2", total: "200", totalOrZero: "200", mean: "100", top: "100.5", flaggedShare: "0", perFlagged: null }
      - { bucket: E, entries: "2", total: "0", totalOrZero: "0", mean: "0", top: "0", flaggedShare: "0", perFlagged: null }
      - { bucket: F, entries: "1", total: null, totalOrZero: "0", mean: null, top: null, flaggedShare: "0", perFlagged: null }
