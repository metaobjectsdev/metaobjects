name: pagination-invalid-value
description: >
  A limit or offset that is not a non-negative integer is refused with `pagination.invalid_value`.
requests:
  - id: r1
    method: GET
    path: "/api/parts?limit=abc"
    expect:
      status: 400
      body:
        equals: {"error": "pagination.invalid_value", "param": "limit", "value": "abc", "expected": "a non-negative integer (0 or more)"}
  - id: r2
    method: GET
    path: "/api/parts?offset=-1"
    expect:
      status: 400
      body:
        equals: {"error": "pagination.invalid_value", "param": "offset", "value": "-1", "expected": "a non-negative integer (0 or more)"}
