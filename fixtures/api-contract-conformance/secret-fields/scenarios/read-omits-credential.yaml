name: read-omits-credential
description: >
  A credential field (`view.password`, "masked input for sensitive values") is never
  returned by a generated read route. `pinHash` is stored on every seeded row and is
  absent from GET by id and from the list; `equals` is a deep-equal, so it asserts the
  ABSENCE of the key and not merely that the value differs.

  `tokenHash` is `@formExclude` only. Excluding a field from a form is about WRITING it;
  the field is still part of the resource and is returned.
requests:
  - id: r1
    method: GET
    path: /api/accounts/1
    expect:
      status: 200
      body:
        equals:
          id: 1
          name: "Ada Lovelace"
          tokenHash: "token-hash-1"
  - id: r2
    method: GET
    path: /api/accounts?sort=id
    expect:
      status: 200
      body:
        equals:
          - id: 1
            name: "Ada Lovelace"
            tokenHash: "token-hash-1"
          - id: 2
            name: "Alan Turing"
            tokenHash: "token-hash-2"
