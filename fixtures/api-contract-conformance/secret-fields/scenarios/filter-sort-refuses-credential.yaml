name: filter-sort-refuses-credential
description: >
  A credential (a field that declares `view.password`) is never on the filter or sort allowlist,
  even when the model marks it `@filterable` and `@sortable`: a filter on a secret is an oracle for
  it (`eq`, or `like` a prefix, one character at a time), and a sort leaks its order. `pinHash`
  carries both marks here and the seeded rows hold distinct values, so a port whose allowlist took
  the marks at their word would answer 200. Every port refuses an explicit request for it with the
  same envelope as any other field the allowlist does not hold (`invalid_filter_field` and
  `invalid_sort`, naming the field), and a field that is not a credential still filters.
requests:
  - id: r1
    method: GET
    path: /api/accounts?filter[pinHash][eq]=pin-hash-1
    expect:
      status: 400
      body:
        error: "invalid_filter_field"
        field: "pinHash"
  - id: r2
    method: GET
    path: /api/accounts?filter[pinHash][like]=pin-hash-1%25
    expect:
      status: 400
      body:
        error: "invalid_filter_field"
        field: "pinHash"
  - id: r3
    method: GET
    path: /api/accounts?sort=pinHash:asc
    expect:
      status: 400
      body:
        error: "invalid_sort"
        field: "pinHash"
  - id: r4
    method: GET
    path: /api/accounts?sort=pinHash:desc
    expect:
      status: 400
      body:
        error: "invalid_sort"
        field: "pinHash"
  - id: r5
    method: GET
    path: /api/accounts?filter[name][eq]=Ada%20Lovelace
    expect:
      status: 200
      body:
        equals:
          - id: 1
            name: "Ada Lovelace"
            tokenHash: "token-hash-1"
            role: "member"
