name: tph-sibling-credential
description: >
  A column that one subtype of a single-table (TPH) hierarchy marks as a credential is a
  credential for the whole table. `approver` is declared by `CouponAuth` as a plain `@filterable`
  and `@sortable` column and by `PermitAuth` as a `view.password`; the hierarchy shares one
  `approver` column, so a filter or sort on it is an oracle for the secret whichever subtype is
  addressed. Every allowlist built for the base and for both subtypes leaves it out, and a request
  that names it is refused with the same envelope as any other field they do not hold
  (`invalid_filter_field`, `invalid_sort`, naming the field) on the base route, on the plain
  subtype's route and on the credential subtype's route. A column that is not a credential still
  filters and sorts.
requests:
  - id: r1
    method: GET
    path: /api/auths?filter[approver][eq]=Dr.%20Smith
    expect:
      status: 400
      body:
        error: "invalid_filter_field"
        field: "approver"
  - id: r2
    method: GET
    path: /api/auths/coupon?filter[approver][eq]=Dr.%20Smith
    expect:
      status: 400
      body:
        error: "invalid_filter_field"
        field: "approver"
  - id: r3
    method: GET
    path: /api/auths/permit?filter[approver][like]=Dr%25
    expect:
      status: 400
      body:
        error: "invalid_filter_field"
        field: "approver"
  - id: r4
    method: GET
    path: /api/auths?sort=approver:asc
    expect:
      status: 400
      body:
        error: "invalid_sort"
        field: "approver"
  - id: r5
    method: GET
    path: /api/auths/coupon?sort=approver:desc
    expect:
      status: 400
      body:
        error: "invalid_sort"
        field: "approver"
  - id: r6
    method: GET
    path: /api/auths/permit?sort=approver:asc
    expect:
      status: 400
      body:
        error: "invalid_sort"
        field: "approver"
  - id: r7
    method: GET
    path: /api/auths?filter[reference][eq]=REF-3
    expect:
      status: 200
      body:
        ids: [3]
  - id: r8
    method: GET
    path: /api/auths?sort=reference:desc
    expect:
      status: 200
      body:
        ids: [3, 2, 1]
