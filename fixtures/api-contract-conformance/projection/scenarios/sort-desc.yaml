name: projection-sort-desc
description: >
  GET /api/invoice_summaries?sort=amountCents:desc — ?sort applies to a
  projection's declared @sortable fields, against the sort allowlist generated
  from the projection's own field set.
requests:
  - id: r1
    method: GET
    path: /api/invoice_summaries?sort=amountCents:desc
    expect:
      status: 200
      body:
        ids: [1, 3, 2, 4]
