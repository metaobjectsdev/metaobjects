name: report-sort-on-defaulted-measure
description: >
  A sort on a defaulted measure is deterministic on every engine: the product with no sale
  sorts as its default, 0. A sort across a measure with no @default, where that row is null,
  is pinned by sort-null-ordering.
requests:
  - id: asc
    method: GET
    path: /api/product_revenues?sort=revenueOrZero:asc&limit=1
    expect:
      status: 200
      body:
        equals:
          - { productId: 3, productName: "Cinder", sales: 0, revenueCents: null, revenueOrZero: 0 }
  - id: desc
    method: GET
    path: /api/product_revenues?sort=revenueOrZero:desc&limit=1
    expect:
      status: 200
      body:
        equals:
          - { productId: 1, productName: "Atlas", sales: 2, revenueCents: 30000, revenueOrZero: 30000 }
