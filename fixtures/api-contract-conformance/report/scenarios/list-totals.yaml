name: report-list-totals
description: >
  GET /api/invoice_totals — a report with no dimensions is exactly one row. Its ratio is a
  decimal, so it is the canonical string of ADR-0019 Amendment 1 (2/5 is "0.4" on every
  engine). withCount=1 wraps the same list in the { rows, total } envelope.
requests:
  - id: r1
    method: GET
    path: /api/invoice_totals
    expect:
      status: 200
      body:
        equals:
          - { invoices: 5, totalCents: 315500, paidShare: "0.4" }
  - id: r2
    method: GET
    path: /api/invoice_totals?withCount=1
    expect:
      status: 200
      body:
        envelope: true
        rowsLength: 1
        total: 1
