name: report-filter-uuid-dimension
description: >
  A uuid dimension (Product.sku, reached through Sale.fkProduct) takes `eq`, `ne` and `in`
  and reaches the wire as its lowercase hyphenated string. Cinder has a sku but no sale, and
  SalesBySku declares no @spine, so it has no row.
requests:
  - id: r1
    method: GET
    path: /api/sales_by_skus?sort=revenueCents:desc
    expect:
      status: 200
      body:
        equals:
          - { productSku: "11111111-1111-4111-8111-111111111111", sales: 2, revenueCents: 30000 }
          - { productSku: "22222222-2222-4222-8222-222222222222", sales: 1, revenueCents: 4500 }
  - id: r2
    method: GET
    path: /api/sales_by_skus?filter[productSku][eq]=22222222-2222-4222-8222-222222222222
    expect:
      status: 200
      body:
        equals:
          - { productSku: "22222222-2222-4222-8222-222222222222", sales: 1, revenueCents: 4500 }
  - id: r3
    method: GET
    path: /api/sales_by_skus?filter[productSku][ne]=22222222-2222-4222-8222-222222222222
    expect:
      status: 200
      body:
        equals:
          - { productSku: "11111111-1111-4111-8111-111111111111", sales: 2, revenueCents: 30000 }
  - id: r4
    method: GET
    path: /api/sales_by_skus?filter[productSku][in]=11111111-1111-4111-8111-111111111111,33333333-3333-4333-8333-333333333333
    expect:
      status: 200
      body:
        equals:
          - { productSku: "11111111-1111-4111-8111-111111111111", sales: 2, revenueCents: 30000 }
