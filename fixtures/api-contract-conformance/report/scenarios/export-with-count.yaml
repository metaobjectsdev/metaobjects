name: report-export-with-count
description: >
  withCount asks for a { rows, total } envelope, which only JSON can carry. With format=csv or
  format=xml it is refused as 400 {"error": "export_with_count"}; the message is free prose.
  With format=json the body is the list route's own withCount envelope, with the export's
  Content-Type and Content-Disposition. Without ?format the existing withCount envelope is
  unchanged.
requests:
  - id: r1
    method: GET
    path: /api/invoice_status_totals?format=csv&withCount=1
    expect:
      status: 400
      body:
        error: "export_with_count"
  - id: r2
    method: GET
    path: /api/invoice_status_totals?format=json&withCount=1
    expect:
      status: 200
      headers:
        content-type: "application/json"
        content-disposition: 'attachment; filename="invoice_status_totals.json"'
      body:
        envelope: true
        total: 3
  - id: r3
    method: GET
    path: /api/invoice_status_totals?format=xml&withCount=true
    expect:
      status: 400
      body:
        error: "export_with_count"
  - id: r4
    method: GET
    path: /api/invoice_status_totals?withCount=1
    expect:
      status: 200
      body:
        envelope: true
        total: 3
