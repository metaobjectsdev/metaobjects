name: report-filter-on-defaulted-measure
description: >
  A filter on a @spine report's measures. r1: revenueOrZero carries @default 0, so the
  default is the value and eq=0 matches the product with no sale. r2: revenueCents has no
  @default, so the same row is null there and isNull=true matches it. r3: a filter on the
  count removes the empty row at request time, so one report serves the page that shows
  it and the page that does not.
requests:
  - id: r1
    method: GET
    path: /api/product_revenues?filter[revenueOrZero][eq]=0
    expect:
      status: 200
      body:
        equals:
          - { productId: 3, productName: "Cinder", sales: 0, revenueCents: null, revenueOrZero: 0 }
  - id: r2
    method: GET
    path: /api/product_revenues?filter[revenueCents][isNull]=true
    expect:
      status: 200
      body:
        equals:
          - { productId: 3, productName: "Cinder", sales: 0, revenueCents: null, revenueOrZero: 0 }
  - id: r3
    method: GET
    path: /api/product_revenues?filter[sales][gt]=0&sort=productId:asc
    expect:
      status: 200
      body:
        equals:
          - { productId: 1, productName: "Atlas", sales: 2, revenueCents: 30000, revenueOrZero: 30000 }
          - { productId: 2, productName: "Beacon", sales: 1, revenueCents: 4500, revenueOrZero: 4500 }
