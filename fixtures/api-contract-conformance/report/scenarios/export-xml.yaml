name: report-export-xml
description: >
  ?format=xml answers <{ReportName}><row><{field}>value</{field}>...</row>...</{ReportName}>
  as application/xml, with Content-Disposition naming <segment>.xml. There is no XML
  declaration and no indentation. Values are in wire form and XML-escaped; there is no
  formula-injection guard in XML. The corpus pins the null form to xsi:nil (the generator
  option xmlNulls: "nil"): the root declares xmlns:xsi and a null field is an empty element
  carrying xsi:nil="true". The body is compared as an XML infoset (element names, attributes,
  text and order), not byte for byte.
requests:
  - id: r1
    method: GET
    path: /api/export_cells?format=xml&sort=totalCents:asc
    expect:
      status: 200
      headers:
        content-type: "application/xml"
        content-disposition: 'attachment; filename="export_cells.xml"'
      body:
        xml: '<ExportCells xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><row><label>=SUM(1+1)</label><cells>1</cells><totalCents>100</totalCents></row><row><label>+1</label><cells>1</cells><totalCents>200</totalCents></row><row><label>-2</label><cells>1</cells><totalCents>300</totalCents></row><row><label>@cmd</label><cells>1</cells><totalCents>400</totalCents></row><row><label>plain</label><cells>1</cells><totalCents>500</totalCents></row><row><label>a,b</label><cells>1</cells><totalCents>600</totalCents></row><row><label>say "hi"</label><cells>1</cells><totalCents>700</totalCents></row><row><label>line one&#10;line two</label><cells>1</cells><totalCents>800</totalCents></row><row><label>&lt;&amp;&gt;</label><cells>1</cells><totalCents>900</totalCents></row><row><label xsi:nil="true"/><cells>1</cells><totalCents>1000</totalCents></row></ExportCells>'
  - id: r2
    method: GET
    path: /api/invoice_status_totals?format=xml&sort=status:asc&limit=2
    expect:
      status: 200
      body:
        xml: '<InvoiceStatusTotals xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><row><status>OPEN</status><invoices>2</invoices><totalCents>130500</totalCents><paidCents xsi:nil="true"/></row><row><status>PAID</status><invoices>2</invoices><totalCents>185000</totalCents><paidCents>185000</paidCents></row></InvoiceStatusTotals>'
  - id: r3
    method: GET
    path: /api/invoice_status_totals?format=xml&filter[invoices][gt]=99
    expect:
      status: 200
      body:
        xml: '<InvoiceStatusTotals xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"/>'
