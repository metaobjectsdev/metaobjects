name: duration-write-read
description: >
  A field.duration is written and read as an ISO-8601 duration under "wire": { "durations": "iso" }
  (D1, D2). Every port answers the one canonical form, [-]PT[nH][nM][n[.f]S]: hours are never folded
  into days, a week is 7 days and a day 24 hours, and zero is PT0S. Years, months, a clock spelling,
  lowercase designators and a JSON number are 400 validation (D3) and persist nothing.
requests:
  - id: r1
    method: POST
    path: /api/timers
    body: { label: plain, timeout: "PT1H30M" }
    expect:
      status: 201
      body:
        row: { id: 1, label: plain, timeout: "PT1H30M" }
  - id: r2
    method: GET
    path: /api/timers/1
    expect:
      status: 200
      body:
        row: { id: 1, label: plain, timeout: "PT1H30M" }
  - id: r3
    method: POST
    path: /api/timers
    body: { label: days, timeout: "P1DT2H" }
    expect:
      status: 201
      body:
        row: { label: days, timeout: "PT26H" }
  - id: r4
    method: POST
    path: /api/timers
    body: { label: seconds, timeout: "PT5400S" }
    expect:
      status: 201
      body:
        row: { label: seconds, timeout: "PT1H30M" }
  - id: r5
    method: POST
    path: /api/timers
    body: { label: week, timeout: "P1W" }
    expect:
      status: 201
      body:
        row: { label: week, timeout: "PT168H" }
  - id: r6
    method: POST
    path: /api/timers
    body: { label: negative, timeout: "-PT1M30S" }
    expect:
      status: 201
      body:
        row: { label: negative, timeout: "-PT1M30S" }
  - id: r7
    method: POST
    path: /api/timers
    body: { label: zero, timeout: "PT0S" }
    expect:
      status: 201
      body:
        row: { label: zero, timeout: "PT0S" }
  - id: r8
    method: POST
    path: /api/timers
    body: { label: fraction, timeout: "PT1.5S" }
    expect:
      status: 201
      body:
        row: { label: fraction, timeout: "PT1.5S" }
  - id: r9
    method: POST
    path: /api/timers
    body: { label: unset }
    expect:
      status: 201
      body:
        row: { label: unset, timeout: null }
  - id: r10
    method: PATCH
    path: /api/timers/1
    body: { timeout: "PT45M" }
    expect:
      status: 200
      body:
        row: { id: 1, label: plain, timeout: "PT45M" }
  - id: r11
    method: GET
    path: /api/timers/1
    expect:
      status: 200
      body:
        row: { id: 1, label: plain, timeout: "PT45M" }
  - id: r12
    method: POST
    path: /api/timers
    body: { label: bad, timeout: "P1M" }
    expect:
      status: 400
      body:
        error: validation
  - id: r13
    method: POST
    path: /api/timers
    body: { label: bad, timeout: "01:30:00" }
    expect:
      status: 400
      body:
        error: validation
  - id: r14
    method: POST
    path: /api/timers
    body: { label: bad, timeout: "pt1h" }
    expect:
      status: 400
      body:
        error: validation
  - id: r15
    method: POST
    path: /api/timers
    body: { label: bad, timeout: 5400 }
    expect:
      status: 400
      body:
        error: validation
  - id: r16
    method: GET
    path: /api/timers?filter[label][eq]=bad
    expect:
      status: 200
      body:
        length: 0
