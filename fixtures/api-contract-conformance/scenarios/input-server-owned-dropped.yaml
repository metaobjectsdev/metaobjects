name: input-server-owned-dropped
description: >
  A write route hands storage only what the client may set. A client-sent `id` on a
  server-generated key and, on update, a `writeOnce` field are declared but server-owned, so
  they are DROPPED SILENTLY: the request answers as if the key were absent (201/200, never
  400), and neither reaches storage. Python 1.2.1 fixed exactly this, where the generated
  routes handed the repository the raw request body. A key the entity does not declare is a
  different case, `input-unknown-fields-rejected`.

  Each body carries an ordinary settable field DELIBERATELY: it is applied, and that pairing
  is what makes the assertion about the server-owned keys and not about the request being
  ignored whole. The GETs of the client's ids prove no row was written or re-keyed under them.
requests:
  - id: r1
    method: POST
    path: /api/authors
    body:
      id: 999
      name: "Barbara Liskov"
      createdAt: "2026-02-01T10:00:00"
    expect:
      status: 201
      body:
        row:
          name: "Barbara Liskov"
        hasId: true
  - id: r2
    method: GET
    path: /api/authors/999
    expect:
      status: 404
  - id: r3
    method: PATCH
    path: /api/authors/1
    body:
      id: 998
      name: "Ada L. (input probe)"
    expect:
      status: 200
      body:
        row:
          id: 1
          name: "Ada L. (input probe)"
  - id: r4
    method: PUT
    path: /api/authors/2
    body:
      id: 997
      name: "Alan T. (input probe)"
      createdAt: "2026-01-02T10:00:00"
      issuedCurrency: "JPY"
    expect:
      status: 200
      body:
        row:
          id: 2
          name: "Alan T. (input probe)"
          # writeOnce: frozen after create, so the PUT's value never lands.
          issuedCurrency: "GBP"
  - id: r5
    method: GET
    path: /api/authors/998
    expect:
      status: 404
  - id: r6
    method: GET
    path: /api/authors/997
    expect:
      status: 404
  - id: r7
    method: GET
    path: /api/authors/1
    expect:
      status: 200
      body:
        row:
          id: 1
          name: "Ada L. (input probe)"
