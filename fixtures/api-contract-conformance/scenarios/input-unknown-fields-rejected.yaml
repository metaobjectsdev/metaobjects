name: input-unknown-fields-rejected
description: >
  `api.unknownFields` at its default, `reject` (this corpus sets nothing). A create, PUT or
  PATCH body carrying a key the entity does not declare is refused before validation with
  `400 {"error": "unknown_fields", "fields": [...]}`, the undeclared keys sorted, and nothing
  is written: the create leaves no row and the updates leave the seeded rows as they were.

  A declared key the client may not set is NOT unknown. The last request echoes back a row as
  a client read it, with the generated `id`, the `writeOnce` field and an `@autoSet` stamp,
  and is answered 200: those keys are dropped, not refused, so a client that sends back the
  read model keeps working. `api-settings/` pins the other value, `drop`.
requests:
  - id: r1
    method: POST
    path: /api/authors
    body:
      name: "Barbara Liskov"
      createdAt: "2026-02-01T10:00:00"
      role: "admin"
      isAdmin: true
    expect:
      status: 400
      body:
        equals:
          error: "unknown_fields"
          fields: [isAdmin, role]
  - id: r2
    method: GET
    path: /api/authors?filter[name][eq]=Barbara%20Liskov
    expect:
      status: 200
      body:
        length: 0
  - id: r3
    method: PATCH
    path: /api/authors/1
    body:
      name: "Ada L. (input probe)"
      isAdmin: true
    expect:
      status: 400
      body:
        equals:
          error: "unknown_fields"
          fields: [isAdmin]
  - id: r4
    method: PUT
    path: /api/authors/2
    body:
      name: "Alan T. (input probe)"
      createdAt: "2026-01-02T10:00:00"
      isAdmin: true
    expect:
      status: 400
      body:
        equals:
          error: "unknown_fields"
          fields: [isAdmin]
  - id: r5
    method: GET
    path: /api/authors/1
    expect:
      status: 200
      body:
        row:
          id: 1
          name: "Ada Lovelace"
  - id: r6
    method: GET
    path: /api/authors/2
    expect:
      status: 200
      body:
        row:
          id: 2
          name: "Alan Turing"
  - id: r7
    method: PATCH
    path: /api/authors/1
    body:
      id: 1
      name: "Ada L. (echoed)"
      createdAt: "2026-01-01T10:00:00"
      issuedCurrency: "USD"
      autoCreatedAt: "2000-01-01T00:00:00"
    expect:
      status: 200
      body:
        row:
          id: 1
          name: "Ada L. (echoed)"
          issuedCurrency: "USD"
