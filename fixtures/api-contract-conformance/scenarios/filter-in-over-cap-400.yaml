name: filter-in-over-cap-400
description: >
  GET /api/authors?filter[name][in]=<101 values> — an `in`-list larger than the
  cross-port cap (100) is rejected with HTTP 400 and the `filter.in_too_large`
  error envelope. Every port's generated (or reference) filter parser applies
  the same cap so a caller cannot force an unbounded IN (...) against the DB.
  The list below carries 101 comma-separated members (one over the cap).
requests:
  - id: r1
    method: GET
    path: /api/authors?filter[name][in]=v1,v2,v3,v4,v5,v6,v7,v8,v9,v10,v11,v12,v13,v14,v15,v16,v17,v18,v19,v20,v21,v22,v23,v24,v25,v26,v27,v28,v29,v30,v31,v32,v33,v34,v35,v36,v37,v38,v39,v40,v41,v42,v43,v44,v45,v46,v47,v48,v49,v50,v51,v52,v53,v54,v55,v56,v57,v58,v59,v60,v61,v62,v63,v64,v65,v66,v67,v68,v69,v70,v71,v72,v73,v74,v75,v76,v77,v78,v79,v80,v81,v82,v83,v84,v85,v86,v87,v88,v89,v90,v91,v92,v93,v94,v95,v96,v97,v98,v99,v100,v101
    expect:
      status: 400
      body:
        error: "filter.in_too_large"
