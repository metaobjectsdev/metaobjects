name: tph-per-subtype-list-and-create
description: >
  FR-017 Tier 4/5 TPH: each concrete subtype has its own URL segment
  (`/auths/bridge`) carved out of the single table. GET filters to that
  subtype; POST creates a row of that subtype — the discriminator is injected
  by the route handler from the URL, NEVER taken from the body (the body omits
  it). The created row joins the polymorphic collection. A subtype's decimal
  (`CopayAuth.copayAmount`, decimal 10,2) is the canonical string on the wire, filters
  exactly on its own segment, and refuses more digits than its declared scale
  (ADR-0019 Amendment 1).
requests:
  - id: r1
    method: GET
    path: /api/auths/bridge?sort=id:asc
    expect:
      status: 200
      body:
        ids: [1]
  - id: r2
    method: GET
    path: /api/auths/bridge/1
    expect:
      status: 200
      body:
        row: { id: 1, type: "Bridge", reference: "REF-1", quantity: 5 }
  - id: r3
    method: POST
    path: /api/auths/bridge
    body:
      reference: "REF-NEW"
      quantity: 9
    expect:
      status: 201
      body:
        row: { type: "Bridge", reference: "REF-NEW", quantity: 9 }
  - id: r4
    method: GET
    path: /api/auths/bridge?sort=id:asc
    expect:
      status: 200
      body:
        length: 2
  - id: r5
    method: GET
    path: /api/auths
    expect:
      status: 200
      body:
        length: 4
  - id: r6
    method: POST
    path: /api/auths/copay
    body:
      reference: "REF-COPAY"
      copayAmount: "8.10"
    expect:
      status: 201
      body:
        row: { type: "Copay", reference: "REF-COPAY", copayAmount: "8.1" }
  - id: r7
    method: GET
    path: /api/auths/copay?filter[copayAmount][gt]=10&sort=id:asc
    expect:
      status: 200
      body:
        ids: [2]
  - id: r8
    method: GET
    path: /api/auths/copay?filter[copayAmount][eq]=8.1
    expect:
      status: 200
      body:
        length: 1
  - id: r9
    method: POST
    path: /api/auths/copay
    body:
      reference: "REF-COPAY-2"
      copayAmount: "1.234"
    expect:
      status: 400
      body:
        error: validation
