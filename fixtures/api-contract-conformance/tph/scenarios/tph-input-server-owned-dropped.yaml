name: tph-input-server-owned-dropped
description: >
  The per-subtype write routes hand storage only what the client may set, the same rule as
  `input-server-owned-dropped` in the core corpus. A client-sent `id` on the generated key, the
  discriminator (`type`) and, on update, a `writeOnce` field are declared but server-owned, so
  they are DROPPED SILENTLY (201/200, never 400): the row keeps its server-assigned id and its
  subtype comes from the URL. An undeclared key is `tph-unknown-fields-rejected`.
requests:
  - id: r1
    method: POST
    path: /api/auths/bridge
    body:
      id: 999
      type: "Copay"
      reference: "REF-INPUT"
      quantity: 3
    expect:
      status: 201
      body:
        row: { type: "Bridge", reference: "REF-INPUT", quantity: 3 }
        hasId: true
  - id: r2
    method: GET
    path: /api/auths/999
    expect:
      status: 404
  - id: r3
    method: PATCH
    path: /api/auths/bridge/1
    body:
      id: 998
      type: "Copay"
      reference: "REF-1-INPUT"
      issuedCurrency: "JPY"
    expect:
      status: 200
      body:
        row: { id: 1, type: "Bridge", reference: "REF-1-INPUT", issuedCurrency: "USD" }
  - id: r4
    method: PUT
    path: /api/auths/copay/2
    body:
      id: 997
      reference: "REF-2-INPUT"
    expect:
      status: 200
      body:
        row: { id: 2, type: "Copay", reference: "REF-2-INPUT" }
  - id: r5
    method: GET
    path: /api/auths/998
    expect:
      status: 404
  - id: r6
    method: GET
    path: /api/auths/997
    expect:
      status: 404
