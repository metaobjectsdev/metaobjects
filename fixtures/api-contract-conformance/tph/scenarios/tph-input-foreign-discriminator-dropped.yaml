name: tph-input-foreign-discriminator-dropped
description: >
  A per-subtype route takes the row's subtype from the URL, never from the body (the 1.2.x
  security fix). A `type` naming a different subtype, sent to the Bridge route, is DROPPED
  SILENTLY on create and on update: the created row is a Bridge, no Copay row appears, and an
  updated Bridge stays a Bridge. Python's generated TPH routes answer this body with 400 rather
  than dropping it; that runner skips this scenario (see the Python codegen KNOWN_GAPS.md).
requests:
  - id: r1
    method: POST
    path: /api/auths/bridge
    body:
      type: "Copay"
      reference: "REF-DISC"
      quantity: 4
    expect:
      status: 201
      body:
        row: { type: "Bridge", reference: "REF-DISC", quantity: 4 }
        hasId: true
  - id: r2
    method: GET
    path: /api/auths/copay?filter[reference][eq]=REF-DISC
    expect:
      status: 200
      body:
        length: 0
  - id: r3
    method: PATCH
    path: /api/auths/bridge/1
    body:
      type: "Copay"
      reference: "REF-1-DISC"
    expect:
      status: 200
      body:
        row: { id: 1, type: "Bridge", reference: "REF-1-DISC" }
  - id: r4
    method: GET
    path: /api/auths/copay?filter[reference][eq]=REF-1-DISC
    expect:
      status: 200
      body:
        length: 0
