name: tph-update-explicit-null-clears
description: >
  FR-036 Program B — the FR-035 present-key PATCH tristate on the TPH per-subtype
  update path. FR-035 shipped the tristate on the vanilla controller; TS/Python/C#
  also cover TPH, but the Java + Kotlin per-subtype update handlers were left on the
  old @Valid full-DTO binding (null-means-omitted, and a @NotNull union DTO would
  400 an omitted required field) — ungated because no TPH tristate scenario existed.

  Contract asserted on PATCH /auths/<sub>/{id} (identical to the vanilla
  update-explicit-null-clears, §12.3):
    - present null on a nullable subtype column       → column set SQL NULL (200)
    - an OMITTED @required column (base or subtype)    → untouched (no 400)
    - a cleared column is settable again               → 200
    - present null on a @required base column          → 400 {error:"validation"}

  Uses the PriorAuth subtype (id=3): the nullable `approver` is cleared and reset,
  while the @required base `reference` (REF-3) and the discriminator `type` are
  OMITTED and must survive untouched. Runs on all five ports, BOTH lanes.

requests:
  # r1 — explicit null clears the nullable `approver`; the required `reference` /
  #      `type` are OMITTED from the patch and must survive (must NOT 400).
  - id: r1
    method: PATCH
    path: /api/auths/priorauth/3
    body:
      approver: null
    expect:
      status: 200
      body:
        row:
          id: 3
          type: "PriorAuth"
          reference: "REF-3"   # omitted from the PATCH → untouched (still the seed)
          approver: null       # explicit null → column cleared
  # r2 — the clear PERSISTED: re-read from the DB, not the mutation's echo.
  - id: r2
    method: GET
    path: /api/auths/priorauth/3
    expect:
      status: 200
      body:
        row:
          id: 3
          reference: "REF-3"
          approver: null
  # r3 — the cleared column is settable again.
  - id: r3
    method: PATCH
    path: /api/auths/priorauth/3
    body:
      approver: "Dr. Jones"
    expect:
      status: 200
      body:
        row:
          id: 3
          approver: "Dr. Jones"
  # r4 — explicit null on the @required base `reference` is rejected with the
  #      cross-port validation envelope.
  - id: r4
    method: PATCH
    path: /api/auths/priorauth/3
    body:
      reference: null
    expect:
      status: 400
      body:
        error: "validation"
