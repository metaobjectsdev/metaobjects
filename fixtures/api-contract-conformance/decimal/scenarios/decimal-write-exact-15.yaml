name: decimal-write-exact-15
description: >
  The decimal-write-exact cases whose values fit 15 significant digits, run on every engine. A
  JSON number is read exactly to 15 significant digits (W4), so 0.3 is "0.3".
requests:
  - id: r1
    method: POST
    path: /api/entries
    body: { bucket: W, amount: "0.1", flagged: false }
    expect:
      status: 201
      body:
        row:
          amount: "0.1"
        hasId: true
  - id: r2
    method: POST
    path: /api/entries
    body: { bucket: W, amount: 0.3, flagged: false }
    expect:
      status: 201
      body:
        row:
          amount: "0.3"
  - id: r3
    method: POST
    path: /api/entries
    body: { bucket: W, amount: "1e-2", flagged: false }
    expect:
      status: 201
      body:
        row:
          amount: "0.01"
  - id: r4
    method: POST
    path: /api/entries
    body: { bucket: W, amount: "100.2500", flagged: false }
    expect:
      status: 201
      body:
        row:
          amount: "100.25"
  - id: r5
    method: GET
    path: /api/entries?filter[bucket][eq]=W&sort=id:asc
    expect:
      status: 200
      body:
        length: 4
  - id: r6
    method: POST
    path: /api/entries
    body: { bucket: Y, amount: "12abc", flagged: false }
    expect:
      status: 400
      body:
        error: validation
  - id: r7
    method: POST
    path: /api/entries
    body: { bucket: Y, amount: "NaN", flagged: false }
    expect:
      status: 400
      body:
        error: validation
  - id: r8
    method: GET
    path: /api/entries?filter[bucket][eq]=Y
    expect:
      status: 200
      body:
        length: 0
