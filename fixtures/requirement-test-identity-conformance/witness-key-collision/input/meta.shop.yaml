metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - identity.primary: { name: pk, fields: [id] }

    # Path Orders.Recorded.
    - requirement.functional:
        name: Orders
        level: 3
        status: live
        statement: Every placed order is kept.
        counterexample: A placed order that is lost.
        children:
          - requirement.functional:
              name: Recorded
              level: 4
              status: live
              statement: An order is recorded when it is placed.
              counterexample: A placed order has no row.
              implementedBy: [Order]

    # Path Orders_Recorded: a different address, and the same witness key.
    - requirement.functional:
        name: Orders_Recorded
        level: 4
        status: live
        statement: An order is recorded once.
        counterexample: Two rows for one order.
        implementedBy: [Order]

    # A doubled underscore. An underscore is outside the kept class like any other
    # character, so the pair is one run and becomes one underscore. No other
    # requirement here mangles to the same key.
    - requirement.functional:
        name: Sales__Orders
        level: 4
        status: live
        statement: An order records the sale it belongs to.
        counterexample: An order with no sale.
        implementedBy: [Order]
