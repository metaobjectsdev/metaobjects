metadata:
  package: acme::shop
  children:
    - object.entity:
        name: Order
        children:
          - field.uuid: { name: id }
          - identity.primary: { name: pk, fields: [id] }

    - object.entity:
        name: Listing
        children:
          - field.uuid: { name: id }
          - identity.primary: { name: pk, fields: [id] }

    - requirement.functional:
        name: Shop
        level: 1
        status: live
        statement: A customer can buy from the shop.
        counterexample: A customer who cannot place an order.
        children:
          - requirement.functional:
              name: Orders
              level: 3
              status: live
              statement: Every placed order is kept.
              counterexample: A placed order that is lost.
              children:
                - requirement.functional:
                    name: Recorded
                    level: 4
                    status: live
                    statement: An order is recorded when it is placed.
                    counterexample: A placed order has no row.
                    implementedBy: [Order]

    # Begins with the same four letters and is not under Shop.
    - requirement.functional:
        name: Shopfront
        level: 1
        status: live
        statement: A customer can see what is for sale.
        counterexample: A product nobody can find.
        children:
          - requirement.functional:
              name: Listed
              level: 4
              status: live
              statement: A product for sale has a listing.
              counterexample: A product for sale with no listing.
              implementedBy: [Listing]
